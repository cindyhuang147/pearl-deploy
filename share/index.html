225 ≈ 230", "cat": "抽樣"}, {"n": "27", "q": "Selected 5 schools at random, interviewed each teacher. This is", "opts": ["a. simple random sampling.", "b. stratified random sampling.", "c. cluster random sampling.", "d. two-stage random sampling."], "ans": "c", "note": "選學校後取所有老師 = 群集抽樣（cluster sampling）", "cat": "抽樣"}, {"n": "28", "q": "Purpose of stratified random sampling:", "opts": ["a. Every member equal chance.", "b. Sample proportionately represents categories.", "c. Most likely to react chosen.", "d. More representative than accessible population."], "ans": "b", "note": "★高頻：按比例代表各類別", "cat": "抽樣"}, {"n": "29", "q": "Courses randomly selected, then seminar groups, then individual students. Method:", "opts": ["a. Systematic sampling", "b. Multi-stage sampling", "c. Stratified sampling", "d. Cluster sampling"], "ans": "b", "note": "多階段抽樣（multi-stage sampling）", "cat": "抽樣"}, {"n": "30", "q": "Which problem attributed to sampling error?", "opts": ["a. Low response rate.", "b. Badly designed questions.", "c. Incorrect data entry.", "d. Bias due to inappropriate choice of respondents."], "ans": "d", "note": "樣本選擇不當 = 抽樣誤差", "cat": "抽樣"}, {"n": "31", "q": "Which form of reasoning draws specific conclusion from premises?", "opts": ["a. Objective reasoning", "b. Positivistic reasoning", "c. Inductive reasoning", "d. Deductive reasoning"], "ans": "d", "note": "演繹推理（deductive）", "cat": "研究哲學"}, {"n": "32", "q": "Research using same design but different sample is an example of:", "opts": ["a. An exploratory study", "b. A replication study", "c. An empirical study", "d. A hypothetical study"], "ans": "b", "note": "複製研究（replication study）", "cat": "研究哲學"}, {"n": "33", "q": "Comprehensive review of literature prior to data collection is NOT recommended by:", "opts": ["a. Ethnomethodology", "b. Grounded theory", "c. Symbolic interactionism", "d. Feminist theory"], "ans": "b", "note": "★高頻：紮根理論（grounded theory）不建議事先大量回顧文獻（避免偏見）", "cat": "研究哲學"}, {"n": "34", "q": "Qualitative for one phase, quantitative for next phase is known as:", "opts": ["a. Action research", "b. Mixed-method research", "c. Deductive research", "d. Pragmatic research"], "ans": "b", "note": "混合方法研究（mixed-method research）", "cat": "研究哲學"}, {"n": "35", "q": "Ethical problems when studying internet because:", "opts": ["a. Everyone has access to digital media.", "b. Respondents may fake identities.", "c. Researchers may fake identities.", "d. Internet research has to be covert."], "ans": "b", "note": "網路研究倫理問題：受訪者可能偽造身分", "cat": "研究流程與倫理"}, {"n": "36", "q": "A random sample can best be described as:", "opts": ["a. Each participant has equal chance of being selected.", "b. Characteristics correspond to larger population.", "c. Selection of cases from larger population.", "d. Selection from control group.", "e. From experimental group."], "ans": "a", "note": "隨機樣本：每人有相等機率被選中", "cat": "抽樣"}, {"n": "37", "q": "__________ designs are research designs with more than one IV.", "opts": ["a. Simple", "b. Monotonic", "c. Factorial", "d. Multi"], "ans": "c", "note": "複因子設計（Factorial design）", "cat": "因素分析"}, {"n": "38", "q": "Music (yes/no) × room temperature (warm/cold). _____ factorial design.", "opts": ["a. 1×2", "b. 2×4", "c. 2×2", "d. 4×4"], "ans": "c", "note": "2×2 factorial design", "cat": "因素分析"}, {"n": "39", "q": "In a 3×3 factorial design, how many conditions?", "opts": ["a. 2", "b. 3", "c. 6", "d. 9"], "ans": "d", "note": "3×3 = 9個條件", "cat": "因素分析"}, {"n": "40", "q": "A 2×2×4 factorial design generates main effect of _____ IVs.", "opts": ["a. 2", "b. 3", "c. 4", "d. 8"], "ans": "b", "note": "2×2×4有3個自變數", "cat": "因素分析"}]}, {"label": "1141（114學年第1學期，2025/11/21）", "qs": [{"n": "1", "q": "What is post-positivism?", "opts": ["a. Epistemological position advocating natural science methods to social reality.", "b. A position that one can make reasonable inferences by combining empirical observations with logical reasoning.", "c. A way of thinking about the research process and staying positive.", "d. An outlook in life about seeing things positively."], "ans": "b", "note": "後實証主義（post-positivism）：結合實徵觀察與邏輯推理做合理推斷，承認知識的不完整性", "cat": "研究哲學"}, {"n": "2", "q": "What does the term epistemology mean?", "opts": ["a. Concerned with the nature of social entities.", "b. The study of philosophy.", "c. The assumptions about the best way to study the world.", "d. Research into ontogeny."], "ans": "c", "note": "認識論（epistemology）：關於如何獲取知識的假設（vs. 本體論ontology關注實體的本質）", "cat": "研究哲學"}, {"n": "3", "q": "A paradigm is:", "opts": ["a. a research tool.", "b. a mental model, frame, or belief system.", "c. a set of theories.", "d. a research strategy."], "ans": "b", "note": "典範（paradigm）= 心智模型、框架或信念系統", "cat": "研究哲學"}, {"n": "4", "q": "In grounded theory, when data is theoretically saturated:", "opts": ["a. Similar concepts grouped into higher order categories.", "b. Data may not fit into specific category.", "c. Categories assembled into causal relationships.", "d. No new categories emerging and existing structure appears stable."], "ans": "d", "note": "★高頻：理論飽和 = 不再出現新類別", "cat": "質性研究"}, {"n": "5", "q": "When no interaction occurs with two IVs, the…", "opts": ["a. effects must be interpreted differently.", "b. effects can be generalized across levels of the other IV.", "c. internal validity is increased.", "d. sensitivity is decreased."], "ans": "b", "note": "無交互作用 → 主效果可跨水準概化", "cat": "效度"}, {"n": "6", "q": "Using the idiographic approach, people seek to…", "opts": ["a. describe one individual's behavior.", "b. create change in an individual's life.", "c. explain a single situation or event in unusually specific detail.", "d. establish general laws of behavior."], "ans": "c", "note": "個案性方法（idiographic）：以極詳細的方式解釋單一情境或事件", "cat": "研究哲學"}, {"n": "7", "q": "A correlational study is uniquely useful for meeting which goal?", "opts": ["a. Description", "b. Creating change", "c. Prediction", "d. Understanding"], "ans": "c", "note": "相關研究最適合達成「預測（prediction）」的目標", "cat": "統計與測量"}, {"n": "8", "q": "Which best describes a natural experiment?", "opts": ["a. Researcher manipulates IV under lab conditions.", "b. Participants randomly assigned by researcher.", "c. Study that examines effects of naturally occurring event approximating random assignment.", "d. Observational study with no attempt to infer causality."], "ans": "c", "note": "自然實驗：研究近似隨機分派的自然發生事件", "cat": "實驗設計"}, {"n": "9", "q": "What does a Type II error represent?", "opts": ["a. Rejecting null when actually true.", "b. Accepting null when actually false.", "c. Failing to collect enough data.", "d. Using inappropriate statistical test."], "ans": "b", "note": "★高頻：Type II error = 接受虛假的H0（偽陰性，β誤差）", "cat": "統計與測量"}, {"n": "10", "q": "Primary purpose of random assignment in an experiment?", "opts": ["a. Ensure sample represents larger population.", "b. Guarantee each participant equal chance of being selected.", "c. Control for confounding variables by evenly distributing them.", "d. Increase external validity.", "e. None."], "ans": "c", "note": "★超高頻：隨機分派 = 控制混淆變數（均勻分配於各組）", "cat": "效度"}, {"n": "11", "q": "What is the social desirability response?", "opts": ["a. Answers that are random or inconsistent.", "b. Responses believed more socially acceptable rather than true feelings.", "c. Researchers influence participants to respond certain way.", "d. Participants misunderstand wording."], "ans": "b", "note": "★高頻：社會期許反應 = 給出被認為更受社會接受的答案", "cat": "問卷與調查"}, {"n": "12", "q": "Two variables causally related if", "opts": ["a. Strong positive correlation.", "b. All extraneous controlled, IV creates consistent differences.", "c. Observed to co-vary on many occasions.", "d. Observed in lab."], "ans": "b", "note": "因果關係條件", "cat": "統計與測量"}, {"n": "13", "q": "Main purpose of CFA?", "opts": ["a. Explore potential underlying factor structures without prior hypotheses.", "b. Confirm whether data fit hypothesized measurement model.", "c. Identify correlations without specifying factors.", "d. Reduce variables into fewer components."], "ans": "b", "note": "★高頻：CFA = 驗證預先指定的因素結構", "cat": "因素分析"}, {"n": "14", "q": "Primary purpose of rotation in factor analysis?", "opts": ["a. Increase total variance explained.", "b. Simplify and clarify the pattern of factor loadings, making factors easier to interpret.", "c. Determine number of factors to extract.", "d. Remove outliers and improve normality."], "ans": "b", "note": "★高頻：轉軸目的 = 簡化並澄清因素負荷量模式，使因素更易解釋", "cat": "因素分析"}, {"n": "15", "q": "Purpose of research design?", "opts": ["a. To develop a hypothesis.", "b. To select a sample.", "c. To determine the methods for data collection and analysis.", "d. To develop a model based on theories.", "e. None."], "ans": "c", "note": "研究設計目的：確定資料收集與分析的方法", "cat": "理論與假設"}, {"n": "16", "q": "Key limitation of cross-sectional design studying causal relationships?", "opts": ["a. Unable to measure differences between groups at a single point.", "b. Requires repeated measures, increases attrition.", "c. Controls for cohort effects by following same participants.", "d. Cannot establish temporal precedence, difficult to infer causality."], "ans": "d", "note": "橫斷面設計缺點：無法建立時間先後順序，難以推論因果", "cat": "其他"}, {"n": "17", "q": "Difference between internal and external validity?", "opts": ["a. Internal = generalizability; external = free from bias.", "b. External = generalizability; internal = free from bias.", "c. Internal = free from bias; external = consistent across populations.", "d. External = free from bias; internal = consistent across populations."], "ans": "b", "note": "★高頻：外部效度 = 結果可概化；內部效度 = 研究本身無偏誤", "cat": "效度"}, {"n": "18", "q": "Manipulation check is used primarily to:", "opts": ["a. Verify random assignment created equivalent groups.", "b. Assess whether IV had intended psychological effect on participants.", "c. Ensure DV accurately measures construct.", "d. Test for potential confounding variables."], "ans": "b", "note": "★高頻：操弄確認 = 確認自變數是否如預期影響參與者", "cat": "實驗設計"}, {"n": "19", "q": "Main objective of quantitative research?", "opts": ["a. Explore and describe a phenomenon in-depth.", "b. Identify patterns and relationships between variables.", "c. Generate new theories and hypotheses.", "d. Understand subjective experiences."], "ans": "b", "note": "量化研究主要目的：找出變數間的規律與關係", "cat": "理論與假設"}, {"n": "20", "q": "Which distinguishes formative from reflective model?", "opts": ["a. Formative: indicators are effects; reflective: indicators cause.", "b. Formative: indicators cause the construct; reflective: indicators are effects.", "c. Both models assume indicators caused by construct.", "d. Both models assume indicators cause construct."], "ans": "b", "note": "★高頻：形成性（formative）= 指標造成構念；反映性（reflective）= 構念造成指標", "cat": "其他"}, {"n": "21", "q": "Disadvantage of pretest-posttest design:", "opts": ["a. Allows assessment of IV effect over time.", "b. Time-consuming and costly.", "c. Eliminates need for control group.", "d. May create threat to internal validity due to pretest."], "ans": "d", "note": "★超高頻：前後測的內部效度威脅", "cat": "效度"}, {"n": "22", "q": "The focus group moderator:", "opts": ["a. Should be as demographically different as possible.", "b. Needs skills in moderating debates.", "c. Should not encourage participants to talk among themselves.", "d. May or may not be the researcher."], "ans": "d", "note": "焦點團體主持人可以是也可以不是研究者", "cat": "質性研究"}, {"n": "23", "q": "Cannot randomly assign students due to constraints, compares two existing classrooms. This is:", "opts": ["a. True experimental design", "b. Quasi-experimental design", "c. Matched pairs design", "d. Pre-experimental design"], "ans": "b", "note": "★高頻：無法隨機分派 = 準實驗設計（quasi-experimental）", "cat": "實驗設計"}, {"n": "24", "q": "A skewed curve is:", "opts": ["a. symmetrical.", "b. identical left and right slopes.", "c. mean, median, mode in same location.", "d. data being bunched to one side or the other."], "ans": "d", "note": "偏態分配：資料集中在一側", "cat": "統計與測量"}, {"n": "25", "q": "Researcher tor experimental design", "b. Factorial design", "c. Quasi-experimental design", "d. Correlational design"], "ans": "b", "note": "兩個因子的組合 = 複因子設計（factorial design）", "cat": "因素分析"}, {"n": "32", "q": "Collects heights of 100 students, calculates mean/median/mode/SD. This is:", "opts": ["a. Univariate analysis", "b. Bivariate analysis", "c. Multivariate analysis", "d. Factor analysis"], "ans": "a", "note": "只分析一個變數（height）= 單變量分析（univariate analysis）", "cat": "因素分析"}, {"n": "33", "q": "Uses computer to classify reviews as positive/negative/neutral. This is:", "opts": ["a. Regression analysis", "b. Sentiment analysis", "c. Factor analysis", "d. Semantic analysis"], "ans": "b", "note": "情感分析（sentiment analysis）：分類文字為正面/負面/中立", "cat": "因素分析"}, {"n": "34", "q": "Spends 6 months in rural village, observing and interviewing. This research approach is:", "opts": ["a. Case study", "b. Ethnography", "c. Experimental research", "d. Survey research"], "ans": "b", "note": "民族誌研究（ethnography）：沉浸於社群的長期田野研究", "cat": "實驗設計"}, {"n": "35", "q": "Students grouped by prior knowledge, then randomly assigned to teaching methods within each group. This is:", "opts": ["a. Completely randomized design", "b. Factorial design", "c. Randomized block design", "d. Quasi-experimental design"], "ans": "c", "note": "隨機化區組設計（randomized block design）：先分區組（blocking）再隨機分派", "cat": "因素分析"}, {"n": "36", "q": "Difference between PCA and EFA?", "opts": ["a. PCA assumes limited underlying factors; EFA does not.", "b. PCA for continuous; EFA for categorical.", "c. EFA assumes limited underlying factors; PCA does not.", "d. EFA for continuous; PCA for categorical."], "ans": "c", "note": "★高頻：EFA假設有底層因素；PCA只做成分縮減", "cat": "因素分析"}, {"n": "37", "q": "For hypothesis to be testable:", "opts": ["a. Must have manipulated IV.", "b. Must be supported by past literature.", "c. Must inform future hypotheses.", "d. Must be falsifiable."], "ans": "d", "note": "假設必須可被反駁（falsifiable）", "cat": "理論與假設"}, {"n": "38", "q": "A correlational design establishes which quality?", "opts": ["a. Causality.", "b. Association.", "c. Mediation.", "d. Independence."], "ans": "b", "note": "相關設計 = 關聯性（association），非因果", "cat": "統計與測量"}, {"n": "39", "q": "What does the term ontology mean?", "opts": ["a. Branch of philosophy examining nature, origin, and limits of knowledge.", "b. Study of the onto tribe.", "c. Research into ontogeny.", "d. The term ontology is concerned with the nature of social entities."], "ans": "d", "note": "★高頻：本體論（ontology）= 關注社會實體的本質", "cat": "研究哲學"}, {"n": "40", "q": "Using the nomothetic approach, psychologists seek to…", "opts": ["a. describe one individual's behavior.", "b. create change in individual's life.", "c. identify a research question.", "d. establish general laws of behavior that apply to a diverse population."], "ans": "d", "note": "律則性（nomothetic）= 建立廣泛適用的一般性法則", "cat": "研究哲學"}]}];window.STAT={"high": [{"title": "因素分析 基本概念（loadings／scores／rotation／PC 法）", "tier": "超高頻（涵蓋13學期）", "star": false, "years": [["1052", "二.5", "PCA 主成份可否藉轉軸以利解釋？（同意否＋理由）"], ["1062", "5", "PCA 與 factor analysis 的差異"], ["1071", "4", "factor loadings vs scores；orthogonal vs oblique"], ["1071", "7", "principal components vs metric MDS"], ["1082", "4", "factor rotation 目的＋何時採 oblique"], ["1092", "4", "loadings vs scores"], ["1101", "4", "PC 應否轉軸達 simple structure？評論"], ["1111", "3", "以 PC method 估計 orthogonal factor model 的 loadings"], ["1112", "4", "orthogonal factor model＋假設＋重建Σ＋估參＋因素個數"], ["1131", "5", "loadings vs scores；正交vs斜交"], ["1132", "6", "PC 可否轉軸？同意否"], ["1132", "7", "以 PC method 估計 factor loadings"]], "sol": [["正交因素模型", "X−μ=Lf+ε，L(p×m)＝loadings、f＝公因素(E[f]=0,Cov(f)=I)、ε＝特殊因素(Cov(ε)=Ψ對角)，f⊥ε；故 Σ=LL′+Ψ（共變異矩陣可由模型重建）。"], ["PC 法估計 loadings", "取 Σ(或 R)特徵值 λ₁≥…≥λp 與特徵向量 e；前 m 個：L̂=[√λ₁e₁┆…┆√λm em]，Ψ̂=diag(Σ−L̂L̂′)。決定 m：λ>1、陡坡圖、累積解釋變異門檻。"], ["loadings vs scores", "loading＝公因素與原變數的相關(結構係數，矩陣L)；score＝個別觀測在公因素上的估計得分 f̂ⱼ(如迴歸法 f̂=L′Σ⁻¹(x−μ))。前者談「因素與變數關係」、後者是「每個人的因素分數」。"], ["轉軸", "L*=LT(T正交)使 loading 趨近0/1利於解釋，不改共同性與總解釋變異。正交=Varimax(因素不相關)；斜交=Oblimin/Promax(允許相關)，理論上因素相關時採斜交。"], ["PCA 可否轉軸（批評題）", "主成份依「最大變異且兩兩正交」唯一決定，轉軸破壞此最優性與正交性，故嚴格而言主成份不應轉軸；會轉軸的是因素分析。作答點出此區別即可。"], ["PCA vs FA / PC vs MDS", "PCA 無誤差項、為變異最大化降維；FA 有特殊因素 ε、解釋共變異。PC由共變異/相關矩陣保留變異；MDS由距離矩陣保留點間距離。"]], "lect": "管理資料分析講義 第五章（5.1 主成份 p.156／5.2 EFA p.170／5.3 CFA p.182）", "book": "Johnson & Wichern Ch8 主成份（§8.2 p.430）；Ch9 因素分析（PC 法 p.488、轉軸 §9.4、scores §9.5）"}, {"title": "Multivariate Paired Comparisons（多變量配對比較）", "tier": "超高頻（涵蓋11學期）", "star": true, "years": [["1052", "二.6", "舉例適用＋檢定程序"], ["1062", "7", "如何進行＋舉例"], ["1071", "6", "如何檢定＋舉例"], ["1082", "6", "4反應 repeated-measures，T² 檢 H₀: μ₁−μ₄=(μ₂−μ₃)/2…"], ["1091", "3", "以 T² 處理配對比較推廣"], ["1092", "5", "以 T² 檢多變量配對差異"], ["1101", "5", "4反應前後測，檢「四者皆無前後差」"], ["1112", "6", "配對比較程序"], ["1122", "3", "兩變數配對：寫 H₀＋檢定"], ["1132", "8", "paired t-test 的 H₀＋檢定（舉例）"], ["1131", "4", "為何配對是 repeated-measures 特例"], ["1141", "4", "同上"]], "sol": [["設定", "第 j 受試者(共n個)有 p 反應變數的前/後測；差值向量 Dⱼ=X₁ⱼ−X₂ⱼ(p×1)，假設 Dⱼ~Nₚ(δ,Σ_D)。"], ["虛無假設", "H₀: δ=0（p 個差值期望同時為 0，各反應皆無前後差）。"], ["檢定統計量", "以 D̄、S_D 算 Hotelling T²=n·D̄′S_D⁻¹D̄。"], ["抽樣分配與拒絕域", "H₀ 下 T²~[(n−1)p/(n−p)]·F_{p,n−p}；T²>[(n−1)p/(n−p)]F_{p,n−p,α} 拒絕。"], ["對比型（1082/1101）", "若 H₀ 為反應間線性對比，用對比矩陣 C 寫成 Cμ=0，T²=n(CX̄)′(CSC′)⁻¹(CX̄)，維度改 C 的列數。"], ["為何是 repeated-measures 特例", "配對＝同一單位、2時點、p反應；重複測度＝同一單位、多時點。把前/後視為2時點，配對即時點數=2 的重複測度，皆用對比矩陣＋T²。"]], "lect": "多變量分析講義 第二章（2.1 平均向量檢定 p.3／2.2 重複測度 p.13）", "book": "Johnson & Wichern §6.2 Paired Comparisons p.273（Repeated Measures p.279）；Ch5 Hotelling T²"}, {"title": "GLT 一般線性檢定（General Linear Test）", "tier": "超高頻（涵蓋12學期）", "star": true, "years": [["1061", "1", "H₀: β₁=β₂,β₃=β₄,β₅=β₆=0"], ["1072", "2a", "H₀: β₁=β₂,β₃=β₄,β₅=0"], ["1082", "2a", "H₀: β₃=β₄=0"], ["1091", "1(1)", "以 GLT 檢 H₀: β₂=β₃"], ["1092", "1a", "GLT 檢 H₀: β₁=β₂,β₃=0＋假設"], ["1101", "1c", "H₀: β₁=β₂,β₃=β₄=β₅=β₆"], ["1111", "2a", "H₀: β₃=β₄=0(X₁X₂已在)"], ["1112", "1", "H₀: β₁=β₂,β₃=0"], ["1121", "2", "full model：H₀₁(全0)＋H₀₂(線性限制)，須寫reduced"], ["1131", "1c", "H₀: β₁=β₂,β₃=β₄=β₅"], ["1141", "1", "檢線性迴歸是否適配(Lack of Fit)"]], "sol": [["原理", "配 Full 得 SSE(F)、df_F；代入 H₀ 限制得 Reduced，配得 SSE(R)、df_R(>df_F)。"], ["檢定統計量", "F*=[(SSE(R)−SSE(F))/(df_R−df_F)]÷[SSE(F)/df_F]。"], ["抽樣分配", "H₀ 下 F*~F_{(df_R−df_F),df_F}；分子自由度=限制式個數。"], ["範例 H₀: β₁=β₂,β₃=0", "Full: Y=β₀+β₁X₁+β₂X₂+β₃X₃+ε；代入(β₁=β₂≡βc,β₃=0)→Reduced: Y=β₀+βc(X₁+X₂)+ε；算SSE套F*，限制2個→分子自由度2。"], ["Lack of Fit 版（1141）", "Full=各 X 水準各一平均的飽和模型(SSE=純誤差SSPE)；Reduced=線性迴歸。F*=[(SSE(R)−SSPE)/(c−2)]÷[SSPE/(n−c)]，c=相異X水準數；顯著表線性不適配。"], ["假設", "εᵢ 獨立、常態、變異齊一(σ²)。"]], "lect": "管理資料分析講義 第二章 迴歸（2.3 模式構建 p.38）＋第三章 ANOVA 迴歸法", "book": "Kutner §2.8 General Linear Test p.72；§7.2 Extra Sums of Squares／partial F p.260"}, {"title": "ANCOVA（covariate＋blocking 的變異數分析）", "tier": "高頻（涵蓋8學期）", "star": true, "years": [["1052", "二.4", "two-factor ANOVA+covariate+blocking：模式/作用/檢視"], ["1062", "9", "RBD+2 covariates：優點/假設/迴歸法檢A×B"], ["1071", "2", "ANCOVA 模型＋假設"], ["1081", "2", "同1052.4"], ["1101", "2", "不均等樣本 two-factor 迴歸法檢交互"], ["1122", "1", "crossed+2 covariates：模型/迴歸表達/GLT檢交互"], ["1131", "2", "模型＋假設＋優點＋迴歸形式"], ["1132", "2", "同1052.4"], ["1132", "9", "two-factor 2 levels 迴歸法檢無交互"]], "sol": [["模型", "Yᵢⱼₖ=μ+τᵢ+βⱼ(block)+γ₁X1+γ₂X2(covariates)+交互項+εᵢⱼₖ，ε~iid N(0,σ²)。"], ["covariate 作用", "以迴歸調整連續干擾變數→降 MSE、提高檢定力，並校正各組 adjusted means。"], ["blocking 作用", "把已知異質來源分區，移除區塊間變異(同 RBD)，使處理比較更精確。"], ["假設", "①斜率同質(homogeneity of slopes) ②covariate 與處理獨立 ③誤差常態獨立齊一 ④covariate 與 Y 線性。"], ["迴歸法檢交互", "把因子設虛擬變數、covariate 為連續項；交互作用以 full(含交互×)vs reduced(去交互)的 general linear test F 檢定(見題型3)。"]], "lect": "管理資料分析講義 第三章 3.2（RBD p.88／ANCOVA p.95）；3.3 雙因子交叉 p.98", "book": "Kutner Ch22 Analysis of Covariance p.917（§22.4 迴歸法 p.933）；Ch21 RBD p.898"}, {"title": "後驗機率 Posterior Probability（分類）", "tier": "高頻（涵蓋10學期）", "star": true, "years": [["1051", "5", "3群"], ["1061", "5", "4群"], ["1062", "8", "3群"], ["1072", "5", "3群"], ["1081", "4b", "4群"], ["1101", "6", "4群"], ["1102", "5", "3群"], ["1112", "7", "3群"], ["1132", "10", "3群，求P(π₁|x)"]], "sol": [["貝氏公式", "pᵢ=群πᵢ先驗、fᵢ(x)=f(x|πᵢ)群內密度。P(πᵢ|x)=pᵢfᵢ(x)/Σⱼpⱼfⱼ(x)，j 涵蓋全部群(g群則 j=1…g)。"], ["歸類法則", "x 分到後驗機率最大的群：assign x→πₖ if P(πₖ|x)≥P(πᵢ|x) ∀i；等誤判成本時即最小 ECM 最適法則。"], ["常態情形", "各群常態且 Σ 相等→線性區別函數(LDF)；Σ 不等→二次區別函數(QDF)。先寫一般貝氏式再補常態特例。"], ["作答模板", "①分子 pᵢfᵢ(x) ②分母 Σpⱼfⱼ(x)(務必含全部群) ③取最大下結論。3群與4群只差求和上限。"]], "lect": "多變量分析講義 第六章 區別分析（歸類與後驗機率 p.82–102）", "book": "Johnson & Wichern §11.3 p.584、§11.5 Several Populations p.606（最小 ECM 法則）"}, {"title": "Logistic Regression 歸類法則", "tier": "高頻（涵蓋7學期）", "star": true, "years": [["1081", "3", "解釋係數＋歸類法則"], ["1092", "3", "建立歸類法則"], ["1101", "3", "解釋係數＋歸類法則"], ["1112", "3", "建立歸類法則"], ["1122", "2", "多元 logistic 含虛擬：解釋 β₁、β₁+β₂、歸類法則"], ["1132", "4", "歸類法則"], ["1141", "3", "歸類法則"], ["1062", "3", "logistic vs DA"], ["1111", "5", "logistic vs DA"], ["1131", "3", "logistic vs DA"], ["1132", "5", "logistic vs DA"]], "sol": [["模型", "π=P(Y=1|x)=1/[1+exp(−(β₀+ΣβⱼXⱼ))]，等價 logit(π)=ln(π/(1−π))=β₀+ΣβⱼXⱼ。"], ["係數解釋", "Xⱼ 增1單位→odds 變 exp(βⱼ) 倍(=odds ratio)。含虛擬(1122)：β₁=群I相對基準群IV的對數勝算差；β₁+β₂ 依虛擬設定組合解讀對應群別。"], ["歸類法則", "估 π̂，門檻0.5：π̂>0.5(等價 logit>0)→判 Y=1，否則 Y=0；門檻可依誤判成本/盛行率(ROC最適切點)調整。"], ["logistic vs DA", "同:二群分類。異:logistic 不需常態/等共變異、用最大概似、對偏離常態穩健；DA 假設各群常態且(線性)共變異相等，符合假設時較有效率。"]], "lect": "管理資料分析講義 第四章 4.2 二元羅吉斯迴歸 p.132", "book": "Kutner §14.3 Simple Logistic p.563、§14.4 Multiple Logistic p.570（分類 p.604）"}, {"title": "多變量聯立區間 / T² / Wilks’ Λ", "tier": "高頻（涵蓋9學期）", "star": true, "years": [["1082", "7", "Bonferroni vs T²-intervals 差異"], ["1092", "6", "one-factor MANOVA(3群2依變數)成對差同時信賴區間"], ["1102", "3", "兩母體平均向量相等檢定(小樣本)＋假設"], ["1061/1072/1102/1141", "名詞", "T²-interval、Wilks’ lambda 常年出現"]], "sol": [["兩母體平均向量(小樣本,1102)", "兩群皆 Nₚ、Σ 相等；以併合 S_pooled 算 T²=(X̄₁−X̄₂)′[S_pooled(1/n₁+1/n₂)]⁻¹(X̄₁−X̄₂)，H₀:μ₁=μ₂ 下 ~[(n₁+n₂−2)p/(n₁+n₂−p−1)]F_{p,n₁+n₂−p−1}。"], ["Wilks’ Λ", "Λ=|E|/|E+H|(E組內、H組間 SSCP)；Λ 越小越拒絕「各組平均向量相等」，可轉近似 F/χ²。"], ["T²-interval vs Bonferroni(1082)", "T²-同時區間對「所有線性組合 a′μ」同時成立，臨界值用√[(n−1)p/(n−p)F]，較寬；Bonferroni 只對事先選定的 m 個比較，各用 α/m 之 t 臨界值，m 不大時較窄較精確。"], ["同時信賴區間(1092)", "成對處理差第 a 分量：(x̄ₖ−x̄ₗ)±(臨界值)√[(1/nₖ+1/nₗ)Eₐₐ/(N−g)]。"]], "lect": "多變量分析講義 第二章 2.1 平均向量檢定 p.3＋第三章 MANOVA p.43", "book": "Johnson & Wichern Ch5（T²、§5.4 同時信賴區間）；§6.4 MANOVA 之 Wilks’ Λ p.301"}, {"title": "MANOVA / Profile Analysis（剖面分析）", "tier": "高頻（涵蓋9學期）", "star": true, "years": [["1061", "4", "舉例 profile analysis"], ["1072", "4", "適用＋檢定"], ["1082", "8", "為何 one-way MANOVA 是 profile 特例"], ["1111", "6", "為何 MANOVA 是 profile 特例"], ["1122", "4", "4反應2群：平行 profiles H₀＋檢定"], ["1071", "9", "two-factor MANOVA 多變量迴歸法檢交互"]], "sol": [["三層次檢定(依序)", "①平行 parallelism(無 group×variable 交互)→H₀:C μ₁=C μ₂(C相鄰差對比) ②重合 coincidence(平行下等高) ③水平 flatness。先平行，成立才檢後二者。"], ["平行性檢定(1122)", "以對比矩陣 C(相鄰反應作差)轉換，檢 H₀:C(μ₁−μ₂)=0，用兩樣本 Hotelling T²(維度 p−1)。"], ["為何 MANOVA 是 profile 特例(1082/1111)", "MANOVA 檢「各群平均向量相等」；profile 的「平行＋重合」合起來等價於平均向量完全相等，故 MANOVA 為其整體版/特例。"], ["two-factor MANOVA 交互(1071)", "以多變量迴歸法把因子設虛擬、交互為乘積項，檢 full vs reduced 的 Wilks’ Λ。"]], "lect": "多變量分析講義 第二章 2.3 剖面分析 p.22＋第三章 MANOVA p.43–57", "book": "Johnson & Wichern §6.4 One-Way MANOVA p.296；§6.8 Profile Analysis p.323"}, {"title": "Canonical Correlation（正準相關）", "tier": "高頻（涵蓋7學期）", "star": false, "years": [["1071", "10", "正準變量可否以與原變數的相關解釋？理由"], ["1092", "7", "對「正準區別以相關解釋」評論"], ["1102", "6", "T/F：(a)正準變量可由相關辨識 (b)第一對正準變量=各自第一主成份？"]], "sol": [["目標", "在 X 組(p)與 Y 組(q)各找 U=a′X、V=b′Y 使 corr(U,V) 最大；依序得多對，正準相關遞減且彼此不相關。"], ["解釋陷阱(1071/1092)", "正準權重受共線性影響不穩，不宜直接解讀；應看正準負荷(canonical loadings＝正準變量與原變數的相關)，故「以相關解釋」是建議做法。"], ["與主成份區別(1102b)", "「第一對正準變量=各自第一主成份」為 False：主成份在單一組內找最大變異，正準變量在兩組之間找最大相關，目標不同。"], ["正準相關平方", "ρ² 為兩正準變量間共享變異比例，才是解釋強度依據(非權重大小)。"]], "lect": "多變量分析講義 第五章 正準相關分析 p.73–81", "book": "Johnson & Wichern Ch10（§10.2 Canonical Variates p.539）"}, {"title": "AR(1) 推導 / 變異-共變異矩陣", "tier": "高頻（涵蓋7學期）", "star": true, "years": [["1051", "2", "寫 AR(1)＋var＋autocov＋autocorr"], ["1082", "3", "σ²、autocorr、檢ρ=0、消除自相關"], ["1091", "2", "誤差項的變異-共變異矩陣"], ["1102", "2", "var、cov"], ["1112", "8", "var、cov、corr"], ["1132", "3", "autocorrelation 顯著時，不增 predictor 下如何檢定係數"]], "sol": [["AR(1) 模型", "εₜ=ρεₜ₋₁+uₜ，uₜ~iid N(0,σ²_u)，|ρ|<1，εₜ 定態。"], ["變異數", "Var(εₜ)=σ²_u/(1−ρ²)。"], ["自我共變異 / 自我相關", "Cov(εₜ,εₜ₋ₖ)=ρᵏσ²_u/(1−ρ²)；Corr(εₜ,εₜ₋ₖ)=ρᵏ。"], ["變異-共變異矩陣(1091)", "Σ_ε=σ²_u/(1−ρ²)×[ρ^{|i−j|}]，Toeplitz 矩陣，對角1、第k次對角 ρᵏ。"], ["檢定與補救(1082/1132)", "檢定:Durbin-Watson；補救:GLS/Cochrane-Orcutt 估 ρ 後做 quasi-differencing Y*ₜ=Yₜ−ρYₜ₋₁ 再 OLS，使誤差近獨立後對係數做 t/F。"]], "lect": "管理資料分析講義 第二章 2.4.2 自我相關誤差項 p.56（PROC AUTOREG）", "book": "Kutner Ch12 Autocorrelation in Time Series（§12.1 p.481）"}, {"title": "Durbin-Watson Test", "tier": "高頻（涵蓋7學期）", "star": true, "years": [["1052", "二.2", "DW 適用場合＋檢定程序"], ["1071", "1", "DW＋假設"], ["1101", "1d", "DW 使用時機＋AR(1) 模型"], ["1091/1111/1121", "名詞", "Durbin-Watson 常年名詞解釋"]], "sol": [["適用場合", "檢迴歸殘差是否一階自相關(時間序列)；前提誤差服從 AR(1)。"], ["統計量", "d=Σₜ₌₂ⁿ(eₜ−eₜ₋₁)²/Σₜ₌₁ⁿeₜ²，d≈2(1−ρ̂)，d∈[0,4]；d≈2 無自相關、<2 正自相關、>2 負自相關。"], ["檢定程序", "H₀:ρ=0；查表得 d_L、d_U：d<d_L 拒絕(正自相關)、d>d_U 不拒絕、d_L≤d≤d_U 無法判定；檢負自相關用 4−d。"], ["限制", "只偵測一階、有無法判定區；資料須依時間排序且模型含截距。"]], "lect": "管理資料分析講義 第二章 2.4 誤差變異一致性與獨立性檢驗 p.52–59", "book": "Kutner §12.3 Durbin-Watson Test p.487"}, {"title": "Partial R²（部分判定係數）", "tier": "高頻（涵蓋10學期）", "star": true, "years": [["1051", "1", "Y&X₁ given X₂X₃X₄；Y&(X₁,X₄) given X₂X₃"], ["1061", "3", "修正 SSR/partial R² 公式"], ["1081", "1a", "Y&(X₃,X₄) given X₁X₂"], ["1082", "2b", "Y&(X₃,X₄) given X₁X₂"], ["1091", "1(2)", "修正公式(3處)"], ["1101", "1b", "Y&(X₄,X₅,X₆) given X₁X₂X₃"], ["1102", "1", "Y&X₁ given X₂X₃X₄；Y&(X₁,X₄) given X₂X₃"], ["1111", "2b", "Y&(X₃,X₄) given X₁X₂"], ["1131", "1d", "Y&X₁ given X₂X₃X₄X₅"]], "sol": [["定義", "在某些變數已在模型的條件下，再加入目標變數所額外解釋的、原未解釋變異之比例。"], ["單一變數公式", "r²_{Y1|2…k}=SSR(X₁|X₂…Xₖ)/SSE(X₂…Xₖ)=[SSE(X₂…Xₖ)−SSE(X₁,…,Xₖ)]/SSE(X₂…Xₖ)。"], ["一組變數公式", "r²_{Y(34)|12}=SSR(X₃,X₄|X₁,X₂)/SSE(X₁,X₂)=[SSE(X₁,X₂)−SSE(X₁,X₂,X₃,X₄)]/SSE(X₁,X₂)。"], ["公式更正題(1061/1091)", "①SSR(X₂,X₃|X₁)=SSR(X₂|X₁)+SSR(X₃|X₁,X₂)(非各自相加) ②SSR(X₃|X₁,X₂)=SSE(X₁,X₂)−SSE(X₁,X₂,X₃)(SSE相減) ③部分判定分母為 SSE(reduced)、分子用 SSR(額外)。"], ["易錯", "分母是 reduced 的 SSE(未解釋部分)非 SSTO；別與整體 R² 混淆。"]], "lect": "管理資料分析講義 第二章（2.1.2 複迴歸 p.16／2.2 淨效果 p.25）", "book": "Kutner §7.4 Coefficients of Partial Determination p.268（§7.1 Extra SS p.256）"}], "mid": [{"title": "迴歸假設 / BLUE / Gauss-Markov", "tier": "中頻（涵蓋5學期）", "star": false, "years": [["1101", "1a", "使 OLS 為 BLUE 的條件"], ["1121", "1a", "房價題：β̂ 成為 BLUE 之條件"], ["1131", "1a", "迴歸模型的假設"], ["1052/1121", "名詞", "BLUE、Gauss-Markov"]], "sol": [["五大假設", "①線性 ②誤差零期望 E(ε)=0 ③變異齊一 Var(ε)=σ²(homoscedasticity) ④誤差互不相關 ⑤(推論用)誤差常態。"], ["Gauss-Markov / BLUE", "前四項成立→OLS 為 BLUE(Best Linear Unbiased Estimator，線性不偏且變異最小)，不需常態假設。"], ["常態假設用途", "僅在 t 檢定、F 檢定與信賴/預測區間時需要(小樣本)；大樣本下由 CLT 近似。"], ["違反與補救", "變異不齊→加權最小平方/穩健標準誤；自相關→GLS(見題型10)；非常態→變數轉換或大樣本。"]], "lect": "管理資料分析講義 第二章 迴歸（2.1 複迴歸）", "book": "Kutner Ch1–3（Gauss-Markov 定理，OLS 為 BLUE）"}, {"title": "其他迴歸專題（標準化迴歸／partial regression plot／VIF）", "tier": "中頻（涵蓋6學期）", "star": false, "years": [["1051", "3", "standardized regression model＋優點"], ["1072", "2b", "建構 partial regression plot for X₁＋用途"], ["1081", "1b", "partial regression plot for X₂＋優點"], ["1082", "1", "partial regression plot＋用途"], ["1112", "2", "partial regression plot for X₁"], ["1131", "1e", "VIF 的用處"], ["1061", "名詞", "multiple correlation coefficient"]], "sol": [["標準化迴歸", "把變數標準化(減平均除標準差)後迴歸；係數無單位可比較相對重要性、降低截距與共線性的數值問題。"], ["partial regression plot", "①Y 對其他自變數迴歸取殘差 e(Y|others) ②Xⱼ 對其他自變數迴歸取殘差 e(Xⱼ|others) ③兩殘差散布；斜率=βⱼ，用於檢視 Xⱼ 的淨線性關係、離群值與是否需非線性項。"], ["VIF", "VIFⱼ=1/(1−R²ⱼ)，R²ⱼ 為 Xⱼ 對其他自變數的判定係數；VIF>10(或>5)表嚴重共線性，係數變異被膨脹。"], ["multiple correlation", "R=√R²，為 Y 與其配適值 Ŷ 的相關，衡量整體線性關聯強度。"]], "lect": "管理資料分析講義 第二章 迴歸", "book": "Kutner §7.5 標準化迴歸 p.271；§10 Added-Variable Plot 與 VIF(§10.5)"}, {"title": "區別分析前置分析 / 評估分類函數", "tier": "中頻（涵蓋4學期）", "star": false, "years": [["1071", "5", "DA 前該做何分析？如何評估分類函數"], ["1081", "4a", "separation 前的分析＋假設"], ["1121", "4", "建立歸類法則所需考量要素"], ["1131", "6", "DA 前該做何分析？如何分類"]], "sol": [["前置分析", "①常態性檢查 ②共變異同質性(Box’s M) ③以逐步法(stepwise)篩選具區別力的變數 ④檢定各組平均向量是否不同(否則無區別力)。"], ["考量要素(歸類)", "先驗機率 pᵢ、誤判成本、各群密度 fᵢ(x)(常態時 Σ 是否相等決定 LDF/QDF)。"], ["評估分類函數", "表面誤判率 APER(以原樣本回代，過度樂觀)；改用交叉驗證/留一法(leave-one-out)估期望實際誤判率(E(AER))，並看混淆矩陣。"]], "lect": "多變量分析講義 第六章 區別分析（stepwise p.87／cross-validation p.99）", "book": "Johnson & Wichern §11.4 Evaluating Classification Functions p.596"}, {"title": "變異數同質檢定（Levene / Brown-Forsythe）", "tier": "中頻（涵蓋5學期）", "star": false, "years": [["1051/1052", "名詞", "Levene test"], ["1061/1072/1111", "名詞", "Brown-Forsythe"]], "sol": [["目的", "檢定各組變異數是否相等(ANOVA 的變異齊一前提)。H₀:σ²₁=…=σ²g。"], ["Levene", "以 |Yᵢⱼ−Ȳᵢ|(對組平均的絕對離差)做單因子 ANOVA。"], ["Brown-Forsythe", "改用中位數版 |Yᵢⱼ−median_i|，對非常態與離群更穩健。"], ["判讀", "顯著→變異不齊，需變數轉換或改用 Welch 校正的 ANOVA。"]], "lect": "管理資料分析講義 第三章 ANOVA", "book": "Kutner §18 變異數齊一性檢定"}, {"title": "Odds Ratio / Logit", "tier": "中頻（涵蓋6學期）", "star": false, "years": [["1052/1072/1091/1102/1111/1141", "名詞", "odds ratio"], ["1121", "名詞", "logit transformation"]], "sol": [["odds 與 odds ratio", "odds=π/(1−π)；odds ratio=exp(β)，即 X 增一單位的勝算倍數(>1 提升、<1 降低)。"], ["logit", "logit=ln(odds)=ln(π/(1−π))，為 logistic 的連結函數，把(0,1)的機率映射到(−∞,∞)以利線性建模。"]], "lect": "管理資料分析講義 第四章 類別資料分析", "book": "Kutner Ch14 Logistic Regression"}, {"title": "Repeated-Measures Design", "tier": "中頻（涵蓋5學期）", "star": true, "years": [["1051", "4", "如何檢定 repeated-measures 的均值相等"], ["1102", "4", "設計＋主要優點"], ["1112", "5", "主要優點＋舉例"], ["1121", "3", "如何消除 unit-to-unit variation＋舉例"]], "sol": [["設計", "同一單位在多個時點/處理下重複測量；以對比矩陣 C 檢 H₀:Cμ=0(各時點均值相等)，用 Hotelling T²(同題型2)。"], ["主要優點", "消除單位間(unit-to-unit)變異對處理比較的影響，所需樣本數較少、檢定力較高。"], ["注意", "需球形性(sphericity)假設；違反時用 Greenhouse-Geisser 校正或多變量法(T²/MANOVA)。"]], "lect": "多變量分析講義 第二章 2.2 重複測度設計 p.13", "book": "Johnson & Wichern §6.9 Repeated Measures Designs p.328"}], "low": [{"title": "ANOVA 迴歸形式", "tier": "低頻（3學期）", "star": false, "years": [["1061", "2", "以迴歸法處理 two-factor ANOVA"], ["1101", "2", "不均等樣本 two-factor 迴歸法檢交互"], ["1132", "9", "two-factor 2 levels 迴歸法檢無交互"]], "sol": [["做法", "把因子水準設虛擬(indicator/effect coding)變數，交互作用=虛擬乘積項；交互/主效果以 full vs reduced 的 general linear test F 檢定(見題型3)。不均等樣本時須用 Type III SS(調整後平方和)。"]], "lect": "管理資料分析講義 第三章 3.3 雙因子交叉 p.98–120", "book": "Kutner Ch19–23 Regression Approach to ANOVA"}, {"title": "Cross vs Nested Designs", "tier": "低頻（3學期）", "star": false, "years": [["1111", "4", "cross vs nested 差異"], ["1141", "2", "crossed vs nested 差異"], ["1081", "名詞", "two-factor nested design"]], "sol": [["差異", "crossed(交叉)：每個 A 水準與每個 B 水準都組合，可估計 A×B 交互作用；nested(巢狀)：B 的水準分別隸屬於不同 A 水準(B 巢狀於 A 內)，無法估計交互作用，只能估 A 與「A 內的 B」效果。"]], "lect": "管理資料分析講義 第三章 3.3–3.4（巢狀 p.122）", "book": "Kutner Ch26 Nested Designs"}, {"title": "ANOVA vs 卡方齊一性檢定", "tier": "低頻（2學期）", "star": false, "years": [["1052", "二.3", "one-factor ANOVA vs 列聯表齊一性檢定 異同"], ["1072", "1", "同上"]], "sol": [["異同", "同:皆檢定「多組之間是否有差異」。異:ANOVA 依變數為連續、比較組平均(F 檢定)；卡方齊一性檢定依變數為類別、比較各組的類別分布(χ² 檢定)。"]], "lect": "管理資料分析講義 第三/四章", "book": "Kutner Ch16(ANOVA)、Ch14(類別)"}, {"title": "Randomized Block Design", "tier": "低頻（2學期）", "star": false, "years": [["1072", "3", "舉例 RBD 適用與操作"], ["1092", "2", "one-factor ANOVA 如何降低非同質實驗單位誤差"]], "sol": [["做法", "將實驗單位依干擾因子分成同質區塊(block)，每區塊內隨機分派各處理；模型 Yᵢⱼ=μ+τᵢ+βⱼ+εᵢⱼ。藉移除區塊間變異降低 MSE、提高處理比較精確度(即 1092 所問的降低非同質單位誤差之法)。"]], "lect": "管理資料分析講義 第三章 3.2.1 隨機集區 p.88", "book": "Kutner Ch21 RBD p.898"}, {"title": "固定 vs 隨機效果模型", "tier": "低頻（1學期）", "star": false, "years": [["1071", "8", "固定 vs 隨機效果差異＋舉例"]], "sol": [["差異", "固定效果:水準為研究關心的特定值，推論僅限這些水準(如三種特定教法)；隨機效果:水準視為自母體隨機抽取，推論及於整個母體(如隨機抽取的工廠)。兩者影響 F 檢定的分母期望均方與變異成分估計。"]], "lect": "管理資料分析講義 第三章 ANOVA", "book": "Kutner Ch25 ANOVA Models II & III"}, {"title": "Multivariate Central Limit Theorem", "tier": "低頻（2學期）", "star": false, "years": [["1062", "6", "敘述多變量 CLT"], ["1082", "5", "多變量 CLT 及用途"]], "sol": [["內容與用途", "大樣本下樣本平均向量近似多變量常態：√n(X̄−μ)→ Nₚ(0,Σ)。用途:即使母體非常態，大樣本仍可用 T²、信賴橢圓等以常態為基礎的多變量推論。"]], "lect": "多變量分析講義 第一/二章", "book": "Johnson & Wichern Ch4 多變量常態"}, {"title": "自相關 vs 自迴歸 概念", "tier": "低頻（2學期）", "star": true, "years": [["1062", "1", "autocorrelation vs autoregressive 差異＋舉例"]], "sol": [["差異", "autocorrelation(自相關)＝誤差(或序列)跨期彼此相關的「現象」；autoregressive(自迴歸)＝描述此相關的「模型」(如 AR(1):εₜ=ρεₜ₋₁+uₜ)。前者是被偵測的問題、後者是用來建模/補救的工具。"]], "lect": "管理資料分析講義 第二章 2.4.2 p.56", "book": "Kutner Ch12"}, {"title": "Ridge Regression（共線性補救）", "tier": "低頻（3學期）", "star": false, "years": [["1122", "5", "嚴重共線性又須保留全部變數→策略"], ["1102/1111", "名詞", "ridge regression"]], "sol": [["做法", "嚴重共線性且須保留所有變數時用脊迴歸：β̂_ridge=(X′X+λI)⁻¹X′Y，加入 λ>0 懲罰使 X′X 可逆，犧牲少許偏誤換取大幅降低變異(MSE 更小)；λ 由脊跡圖或交叉驗證選取。"]], "lect": "管理資料分析講義 第二章 迴歸", "book": "Kutner §11.2 Ridge Regression"}, {"title": "Bootstrapping", "tier": "低頻（1學期）", "star": false, "years": [["1092", "1d", "如何取得迴歸係數的 bootstrap 信賴區間"]], "sol": [["做法", "對原樣本(或殘差)有放回重抽 B 次，每次重估迴歸係數，得係數的經驗分布；以百分位數法(取 2.5%、97.5% 分位)構造信賴區間，免分配假設。"]], "lect": "管理資料分析講義（迴歸推論）", "book": "Kutner §11 Bootstrapping"}, {"title": "抽樣與分類雜項名詞", "tier": "低頻", "star": false, "years": [["1062", "4", "multinomial vs product-multinomial sampling"], ["1061/1081", "名詞", "Hosmer-Lemeshow"], ["1051", "名詞", "Poisson regression、log-linear、nonmetric MDS、PCR"], ["1052", "名詞", "K-means"], ["1051/1091", "名詞", "confidence region"]], "sol": [["multinomial vs product-multinomial", "multinomial:固定總數 n、對各格抽樣；product-multinomial:固定各列(組)邊際、各列分別抽樣。影響列聯表分析的模型與檢定設定。"], ["其他名詞速記", "Hosmer-Lemeshow:logistic 適配度檢定(分組比較觀測 vs 預期)；Poisson regression:計數資料 ln(μ)=Xβ；log-linear:列聯表頻次取對數的線性模型；K-means:非階層分群；confidence region:參數向量的聯合信賴區域；PCR:主成份迴歸(以主成份取代共線變數)。"]], "lect": "管理資料分析講義 第四章／多變量第六章", "book": "Kutner Ch14；Johnson & Wichern Ch11–12"}]};window.STATFULL={"1051": {"qs": [{"label": "1", "sect": "名詞", "text": "confidence region", "pts": 5}, {"label": "2", "sect": "名詞", "text": "factor scores", "pts": 5}, {"label": "3", "sect": "名詞", "text": "Levene test", "pts": 5}, {"label": "4", "sect": "名詞", "text": "Log-linear models", "pts": 5}, {"label": "5", "sect": "名詞", "text": "nonmetric multidimensional scaling", "pts": 5}, {"label": "6", "sect": "名詞", "text": "partial correla ", "sect": "名詞", "text": "Brown-Forsythe", "pts": 5}, {"label": "3", "sect": "名詞", "text": "cross-validation", "pts": 5}, {"label": "4", "sect": "名詞", "text": "factor scores", "pts": 5}, {"label": "5", "sect": "名詞", "text": "log-linear models", "pts": 5}, {"label": "6", "sect": "名詞", "text": "multiple correlation coefficient", "pts": 5}, {"label": "7", "sect": "名詞", "text": "multivariate paired comparisons", "pts": 5}, {"label": "8", "sect": "名詞", "text": "odds ratio", "pts": 5}, {"label": "9", "sect": "名詞", "text": "T2-interval", "pts": 5}, {"label": "10", "sect": "名詞", "text": "Wilks’ lambda", "pts": 5}, {"label": "1", "sect": "問答", "text": "請說明 one-factor ANOVA 與 test of homogeneity in the contingency table analysis 之異同。", "pts": 10}, {"label": "2", "sect": "問答", "text": "Consider a multiple regression model with five predictors as follows: Y = β₀ + β₁X₁ + β₂X₂ + β₃X₃ + β₄X₄ + β₅X₅ + ε. (a) State how to test H₀: β₁ = β₂, β₃ = β₄, β₅ = 0. (b) State how to construct the partial regression plot for X₁, given X₂, X₃, X₄, and X₅ already in the model. Also state the usefulness of the partial regression plot.", "pts": 10}, {"label": "3", "sect": "問答", "text": "試舉一例說明 randomized block design之適用場合及操作程序。", "pts": 10}, {"label": "4", "sect": "問答", "text": "試舉一例說明 profile analysis之適用場合及檢定程序。", "pts": 10}, {"label": "5", "sect": "問答", "text": "Let p₁, p₂, and p₃ be the prior probabilities for the three groups π₁, π₂, and π₃. Let fᵢ(x) = f(x|πᵢ), i = 1, 2, 3. Find the posterior probability P(πᵢ|x).", "pts": 10}]}, "1081": {"qs": [{"label": "1", "sect": "名詞", "text": "canonical correlation", "pts": 5}, {"label": "2", "sect": "名詞", "text": "Durbin-Watson", "pts": 5}, {"label": "3", "sect": "名詞", "text": "factor loading", "pts": 5}, {"label": "4", "sect": "名詞", "text": "general linear test", "pts": 5}, {"label": "5", "sect": "名詞", "text": "Hosmer-Lemeshow", "pts": 5}, {"label": "6", "sect": "名詞", "text": "multivariate paired comparisons", "pts": 5}, {"label": "7", "sect": "名詞", "text": "principal components", "pts": 5}, {"label": "8", "sect": "名詞", "text": "two-factor nested design", "pts": 5}, {"label": "1", "sect": "問答", "text": "Consider a multiple regression model Y = β₀ + β₁X₁ + β₂X₂ + β₃X₃ + β₄X₄ + ε. (a) Obtain the coefficient of partial determination between Y and (X₃, X₄), given X₁, X₂. (5%) (b) State how to obtain the partial regression plot for X₂ and advantages of the plot. (10%)", "pts": 15}, {"label": "2", "sect": "問答", "text": "在 two-factor analysis of variance with interaction 中，加入一 covariate 與一 blocking variable，則模式為何？加入 covariate 與 blocking variable 之作用何在？其效果如何檢視？ (10%)", "pts": 10}, {"label": "3", "sect": "問答", "text": "針對 binary logistic regression，(a) 請解釋 regression coefficients。(5%) (b) 請說明歸類法則如何建立。(5%)", "pts": 10}, {"label": "4", "sect": "問答", "text": "Answer the following questions regarding discriminant analysis: (a) What analysis should be done before separation is performed? State the assumptions on which that analysis is based. (10%) (b) Let p₁, p₂, p₃, and p₄ be the prior probabilities for groups π₁, π₂, π₃, and π₄. Let fᵢ(x) = f(x|πᵢ), i = 1, 2, 3, 4. Find the posterior probability P(πᵢ|x). (10%) (c) How do you choose between discriminant analysis and logistic regression? (5%)", "pts": 25}]}, "1082": {"qs": [{"label": "1", "sect": "問答", "text": "State the partial regression plot and the usefulness of the plot. (10%)", "pts": 10}, {"label": "2", "sect": "問答", "text": "Consider the following regression model: Yᵢ = β₀ + β₁Xᵢ + β₂Xᵢ² + β₃Xᵢ³ + β₄Xᵢ⁴ + εᵢ, i = 1, 2, …, n. (a) State how to test H₀: β₃ = β₄ = 0. (10%) (b) Obtain the coefficient of partial determination between Y and (X³, X⁴), given X and X² in the model. (10%)", "pts": 10}, {"label": "3", "sect": "問答", "text": "Consider a regression model as follows: Yₜ = β₀ + β₁Xₜ + εₜ, t = 1, 2, …, n, where errors εₜ are autocorrelated with the first-order autoregressive model given by εₜ = φεₜ₋₁ + δₜ, t = 2, …, n, where φ denotes the autoregressive parameter such that |φ| < 1 and δₜ are independent N(0, σ²_δ). It can be shown that errors εₜ have constant variance, denoted by σ²_ε. (a) Find σ²_ε. (5%) (b) Find the autocorrelation coefficient ρ(εₜ, εₜ₋₁). (5%) (c) Give a method to test H₀: ρ(εₜ, εₜ₋₁) = 0. (5%) (d) Give an approach to remove autocorrelation. (5%)", "pts": 5}, {"label": "4", "sect": "問答", "text": "State the purpose of factor rotation and when an oblique rotation should be conducted. (10%)", "pts": 10}, {"label": "5", "sect": "問答", "text": "State the multivariate central limit theorem and the usefulness of the theorem. (10%)", "pts": 10}, {"label": "6", "sect": "問答", "text": "Consider a repeated-measures design where there are four response variables Y1, Y2, Y3, and Y4, with the means of μ₁, μ₂, μ₃, and μ₄. State how to use Hotelling's T² to test H₀: μ₁ = μ₄, μ₂ = (μ₃ + μ₄)/2. (10%)", "pts": 10}, {"label": "7", "sect": "問答", "text": "State the difference between the Bonferroni intervals and the T2-intervals. (10%)", "pts": 10}, {"label": "8", "sect": "問答", "text": "Explain why one-way MANOVA is a special case of profile analysis. (10%)", "pts": 10}]}, "1091": {"qs": [{"label": "1", "sect": "名詞", "text": "Analysis of covariance", "pts": 5}, {"label": "2", "sect": "名詞", "text": "Bonferroni", "pts": 5}, {"label": "3", "sect": "名詞", "text": "Canonical correlation", "pts": 5}, {"label": "4", "sect": "名詞", "text": "Cochrane-Orcutt", "pts": 5}, {"label": "5", "sect": "名詞", "text": "confidence region", "pts": 5}, {"label": "6", "sect": "名詞", "text": "Durbin-Watson", "pts": 5}, {"label": "7", "sect": "名詞", "text": "interaction effect", "pts": 5}, {"label": "8", "sect": "名詞", "text": "oblique rotation", "pts": 5}, {"label": "9", "sect": "名詞", "text": "odds ratio", "pts": 5}, {"label": "10", "sect": "名詞", "text": "principal components", "pts": 5}, {"label": "11", "sect": "名詞", "text": "Wilks’ lambda", "pts": 5}, {"label": "1", "sect": "問答", "text": "Consider the following regression model: Yᵢ = β₀ + β₁X1ᵢ + β₂X2ᵢ + β₃X3ᵢ + εᵢ, i = 1, 2, …, n. (1) State how to test H₀: β₂ = β₃ by using the general linear test approach. (10%) (2) Please make corrections for each of the following formulas. (15%) (a) SSR(X₁, X₂, X₃) = SSR(X₁) + SSR(X₂) + SSR(X₃) (b) SSR(X₃ | X₁, X₂) = SSE(X₁, X₂, X₃) − SSE(X₁, X₂) (c) The coefficient of partial determination between Y and X₃ given that X₁ and X₂ are in the model is R²_{Y3.12} = SSE(X₃ | X₁, X₂) / SSE(X₁, X₂)", "pts": 25}, {"label": "2", "sect": "問答", "text": "Consider the following regression model for the time series data: Yₜ = β₀ + β₁Xₜ + εₜ, t = 1, 2, …, n, where errors εₜ are autocorrelated with the first-order autoregressive model given by εₜ = φεₜ₋₁ + uₜ, t = 2, …, n, where φ denotes the autoregressive parameter such that |φ| < 1 and uₜ are independent N(0, σ²). Find the variance-covariance matrix of the error terms ε₁, ε₂, …, εₙ. (10%)", "pts": 10}, {"label": "3", "sect": "問答", "text": "State how to use Hotelling's T² to handle the multivariate extension of the paired comparison. (Define the notation you use.) (10%)", "pts": 10}]}, "1092": {"qs": [{"label": "1", "sect": "問答", "text": "Consider the following multiple regression: Yᵢ = β₀ + β₁Xᵢ₁ + β₂Xᵢ₂ + β₃Xᵢ₃ + β₄Xᵢ₄ + εᵢ, i = 1, 2, …, n. (a) State how to use the general linear test approach to test H₀: β₁ = β₂, β₃ = 0, and the assumptions needed to conduct the test. (15%) (b) Obtain the coefficient of partial determination r²_{Y34.12} between Y and (X₃, X₄), given that X₁ and X₂ are in the model. (5%) (c) What is autocorrelation? State how to test for autocorrelation. (10%) (d) State how to obtain bootstrap confidence intervals for regression coefficients. (10%)", "pts": 15}, {"label": "2", "sect": "問答", "text": "Give suggestions for one-factor ANOVA to reduce experimental errors that may result from non-homogeneous experimental units. (10%)", "pts": 10}, {"label": "3", "sect": "問答", "text": "State how to build a classification rule in binary logistic regression. (10%)", "pts": 10}, {"label": "4", "sect": "問答", "text": "State the difference between factor loadings and factor scores in factor analysis. (10%)", "pts": 10}, {"label": "5", "sect": "問答", "text": "State how to use Hotelling’s T2 to test for multivariate paired differences. (10%)", "pts": 10}, {"label": "6", "sect": "問答", "text": "State how to construct simultaneous confidence intervals for pairwise differences in one-factor MANOVA with three groups and two dependent variables. (10%)", "pts": 10}, {"label": "7", "sect": "問答", "text": "Please comment on the statement that “interpretation for a canonical discriminant is based on the correlations between the canonical discriminant and the original variables”. (10%)", "pts": 10}]}, "1101": {"qs": [{"label": "1", "sect": "問答", "text": "Consider the following multiple regression model: Yᵢ = β₀ + β₁Xᵢ₁ + β₂Xᵢ₂ + β₃Xᵢ₃ + … + β₆Xᵢ₆ + εᵢ, i = 1, …, 50. (a) State the conditions needed to make the least squares estimators for β₀, β₁, …, β₆ best linear unbiased estimators. (10%) (b) Obtain the coefficient of partial determination between Y and (X₄, X₅, X₆), given that (X₁, X₂, X₃) are in the model. (10%) (c) State how to use the general linear test to test H₀: β₁ = β₂, β₃ = β₄, β₅ = β₆. (10%) (d) State the situation when the Durbin-Watson test should be conducted. Also state the first-order autoregressive model for errors, on which the Durbin-Watson test is based. (10%)", "pts": 10}, {"label": "2", "sect": "問答", "text": "Consider a two-factor fixed-effects ANOVA model with 3 levels for each factor. For the cases where the sample sizes are unequal among the 9 cells, state how to test for the interaction effects with the regression approach. Please clearly define the notations used. (15%)", "pts": 15}, {"label": "3", "sect": "問答", "text": "In binary logistic regression, how do you interpret the regression coefficients? (5%) How do you build a classification rule? (10%)", "pts": 5}, {"label": "4", "sect": "問答", "text": "Please give comments on the statement that “The principal components should be rotated to achieve a simple structure to facilitate interpretation.” (10%)", "pts": 10}, {"label": "5", "sect": "問答", "text": "Consider the multivariate extension of the paired comparison. For the jth unit, let X denote the first response before treatment, 11j X denote the first response after treatment, 21j X denote the second response before treatment, 12j X denote the second response after treatment, 22j X denote the third response before treatment, 13j X denote the third response after treatment, 23j X denote the fourth response before treatment, 14j X denote the fourth response after treatment. 24j State how to test H : none of the four responses shows before-after difference. 0 Please clearly define the notation", "pts": 10}, {"label": "6", "sect": "問答", "text": "Let p₁, p₂, p₃, and p₄ be the prior probabilities for the four groups π₁, π₂, π₃, and π₄. Let fᵢ(x) = f(x|πᵢ), i = 1, 2, 3, 4. Find the posterior probability P(πᵢ|x). (10%)", "pts": 10}]}, "1102": {"qs": [{"label": "1", "sect": "名詞", "text": "contrast matrix", "pts": 5}, {"label": "2", "sect": "名詞", "text": "factor scores", "pts": 5}, {"label": "3", "sect": "名詞", "text": "multivariate central limit theorem", "pts": 5}, {"label": "4", "sect": "名詞", "text": "odds ratio", "pts": 5}, {"label": "5", "sect": "名詞", "text": "ridge regression", "pts": 5}, {"label": "6", "sect": "名詞", "text": "T2-interval", "pts": 5}, {"label": "7", "sect": "名詞", "text": "Wilks’ lambda", "pts": 5}, {"label": "8", "sect": "名詞", "text": "Wishart distribution", "pts": 5}, {"label": "1", "sect": "問答", "text": "Consider the following multiple regression model: Y = β₀ + β₁X₁ + β₂X₂ + β₃X₃ + β₄X₄ + ε. (a) Find the coefficient of partial determination between Y and X₁, given X₂, X₃, and X₄. (5%) (b) Find the coefficient of partial determination between Y and (X₁, X₄), given X₂ and X₃. (5%)", "pts": 5}, {"label": "2", "sect": "問答", "text": "Consider a simple regression model as follows: Yₜ = β₀ + β₁Xₜ + εₜ, t = 1, 2, …, n, where errors εₜ are autocorrelated with the first-order autoregressive model given by εₜ = ρεₜ₋₁ + uₜ, uₜ are i.i.d. N(0, σ²). (a) Find the variance of εₜ. (5%) (b) Find the covariance of εₜ and εₜ₋₁. (5%)", "pts": 5}, {"label": "3", "sect": "問答", "text": "State how to test the equality of the mean vectors from two populations for small sample sizes. State the assumptions needed for the test. (10%)", "pts": 10}, {"label": "4", "sect": "問答", "text": "State the repeated-measures design and its main advantage. (10%)", "pts": 10}, {"label": "5", "sect": "問答", "text": "Let p₁, p₂, and p₃ be the prior probabilities for the three groups π₁, π₂, and π₃. Let fᵢ(x) = f(x|πᵢ), i = 1, 2, 3. Find the posterior probability P(πᵢ|x). (10%)", "pts": 10}, {"label": "6", "sect": "問答", "text": "Indicate ‘True’ or ‘False” for each of the following two statements. If false, give reasons. (5% for each) (a) “In canonical correlation, canonical variables can be well identified by computing the correlations between the canonical variables and the original variables.” (b) “The first pair of canonical variables for two groups of variables, X and Y, are actually the first principal component of X and that of Y.”", "pts": 5}]}, "1111": {"qs": [{"label": "1", "sect": "問答", "text": "Please explain the following keywords： (5% for each) (a) Brown-Forsythe test (b) Canonical correlation (c) Durbin-Watson test (d) Factor rotation (e) Hotelling’s T2 (f) Multiple comparisons (g) Odds ratio (h) Ridge regression (i) The first-order autoregressive model (j) Wilks’ lambda", "pts": 5}, {"label": "2", "sect": "問答", "text": "Consider the following regression model: Yᵢ = β₀ + β₁X1ᵢ + β₂X2ᵢ + β₃X3ᵢ + β₄X4ᵢ + εᵢ, i = 1, 2, …, 50. (a) State how to test H₀: β₃ = β₄ = 0, given that X1 and X2 are already in the model. (5%) (b) Obtain the coefficient of partial determination between Y and (X3, X4), given that X1 and X2 are in the model. (5%)", "pts": 5}, {"label": "3", "sect": "問答", "text": "Describe the principal component method for estimating loadings of an orthogonal factor model. (10%)", "pts": 10}, {"label": "4", "sect": "問答", "text": "State the difference between cross and nested designs. (10%)", "pts": 10}, {"label": "5", "sect": "問答", "text": "State the difference between logistic regression and discriminant analysis. (10%)", "pts": 10}, {"label": "6", "sect": "問答", "text": "Explain why MANOVA is a special case of profile analysis. (10%)", "pts": 10}]}, "1112": {"qs": [{"label": "1", "sect": "問答", "text": "Consider the following multiple regression model: Yᵢ = β₀ + β₁Xᵢ₁ + β₂Xᵢ₂ + β₃Xᵢ₃ + β₄Xᵢ₄ + εᵢ, i = 1, 2, …, n. Under appropriate assumptions, state how to test H₀: β₁ = β₂, β₃ = 0. (10%)", "pts": 10}, {"label": "2", "sect": "問答", "text": "Consider a regression model with a dependent variable Y and two predictors X and X . 1 2 State how to obtain the partial regression plot for X . (10%) 1", "pts": 10}, {"label": "3", "sect": "問答", "text": "State how to build a classification rule for the binary logistic regression. (10%)", "pts": 10}, {"label": "4", "sect": "問答", "text": "State the orthogonal factor model and the underlying assumptions (the notations used need to be clearly defined). (10%) State how the covariance matrix can be reproduced from the model. (5%) State how to estimate model parameters. (5%) State how to determine the number of common factors. (5%)", "pts": 10}, {"label": "5", "sect": "問答", "text": "State the main advantage of the repeated-measures design and give an example. (10%)", "pts": 10}, {"label": "6", "sect": "問答", "text": "State the multivariate extension of the paired-comparison procedure. (10%)", "pts": 10}, {"label": "7", "sect": "問答", "text": "Let p₁, p₂, and p₃ be the prior probabilities for the three groups π₁, π₂, and π₃. Let fᵢ(x) = f(x|πᵢ), i = 1, 2, 3. Find the posterior probability P(πᵢ|x). (10%)", "pts": 10}, {"label": "8", "sect": "問答", "text": "Consider a simple regression model as follows: Yₜ = β₀ + β₁Xₜ + εₜ, t = 1, 2, …, n, where errors εₜ are autocorrelated with the first-order autoregressive model given by εₜ = ρεₜ₋₁ + uₜ, where ρ is the autoregressive parameter such that |ρ| < 1 and uₜ are independently N(0, σ²). (a) Find the variance of εₜ. (5%) (b) Find the covariance of εₜ and εₜ₋₁. (5%) (c) Find the correlation of εₜ and εₜ₋₂. (5%)", "pts": 5}]}, "1121": {"qs": [{"label": "1", "sect": "問答", "text": "在台北市士林區房價影響因素之研究中，已隨機取得成交樣本 30 戶，迴歸模式如下：Yᵢ = β₀ + β₁X1ᵢ + β₂X2ᵢ + β₃X3ᵢ + εᵢ, i = 1, 2, …, 30，其中 Y 表每坪房價(單位萬元)，X1 表坪數大小，X2 表樓層，X3 表屋齡。統計推論之結果如下｜係數表：截距 估計 25.32、SE 1.386、t 18.27、p<0.001；X1 估計 1.06、SE 0.356、t 2.98、p<0.005；X2 估計 0.85、SE 0.277、t 3.07、p<0.005；X3 估計 −0.95、SE 0.434、t −2.19、p<0.025。ANOVA Table：迴歸 df 3、SS 291.27、MS 97.09、F 5.65、p<0.01；誤差 df ＿、SS 446.43、MS ＿；總和 df ＿、SS 737.70。請回答下列問題：(a) 最小平方估計量 β̂₀, β̂₁, β̂₂, β̂₃ 成為 BLUE 之條件為何？ (b) 請填入 ANOVA Table 中畫底線上方空白處之數字。 (c) ANOVA Table 中 F 值 (5.65) 所檢定之 null hypothesis 為何？該值是如何求得？ (d) 判定係數 R² 為何？ (e) X1 所對應之 t 值 (2.98) 所檢定之 null hypothesis 為何？該值是如何求得？ (f) 你是否贊成以簡單迴歸推論房價 (Y) 與坪數大小 (X1) 的關聯？若不贊成，請說明理由。 (20%)", "pts": 10}, {"label": "2", "sect": "問答", "text": "考慮迴歸之 full model 如下：Yᵢ = β₀ + β₁X1ᵢ + β₂X2ᵢ + β₃X3ᵢ + β₄X4ᵢ + β₅X5ᵢ + β₆X6ᵢ + εᵢ, i = 1, 2, …, 60。請利用 general linear test 求取檢定 H₀₁: β₁ = β₂ = β₃ = β₄ = β₅ = β₆ = 0 以及 H₀₂: β₁ = β₂ = β₃, β₄ = β₅ = β₆ 之檢定統計量，並說明其抽樣分配。(The reduced models under H₀₁ 以及 H₀₂ 必須敘明) (10%)", "pts": 10}, {"label": "3", "sect": "問答", "text": "相對於ANOVA，repeated measures design 能消除the influence of unit-to-unit variation on treatment comparisons。請舉一例說明。 (10%)", "pts": 10}, {"label": "4", "sect": "問答", "text": "在區別分析(discriminant analysis)中，建立歸類法則(classification rule)所需考量的要素 為何？ (10%)", "pts": 10}, {"label": "1", "sect": "名詞", "text": "AR(1)", "pts": 5}, {"label": "2", "sect": "名詞", "text": "canonical correlation", "pts": 5}, {"label": "3", "sect": "名詞", "text": "coefficient of partial determination", "pts": 5}, {"label": "4", "sect": "名詞", "text": "Durbin-Watson", "pts": 5}, {"label": "5", "sect": "名詞", "text": "Gauss-Markov", "pts": 5}, {"label": "6", "sect": "名詞", "text": "Hosmer-Lemeshow", "pts": 5}, {"label": "7", "sect": "名詞", "text": "logit transformation", "pts": 5}, {"label": "8", "sect": "名詞", "text": "oblique rotation", "pts": 5}, {"label": "9", "sect": "名詞", "text": "profile analysis", "pts": 5}, {"label": "10", "sect": "名詞", "text": "T2-intervals", "pts": 5}]}, "1122": {"qs": [{"label": "1", "sect": "問答", "text": "Consider a two-factor (A, B) crossed design with two covariates (X1, X2), where factor A has three levels and factor B has two levels. Let the response variable be Y. (a) State the model for the design. (10%) (b) Express the model by using the regression approach. (10%) (c) State how to test for the interaction effects by using the general linear test approach. (10%)", "pts": 10}, {"label": "2", "sect": "問答", "text": "Consider the following multiple logistic regression model: π = P(Y=1) = [1 + exp(−(β₀ + β₁D1 + β₂D2 + β₃D3 + β₄X1 + β₅X2))]⁻¹, where D1, D2, and D3 are the dummy variables defined as follows｜Group(D1, D2, D3)：I(1, 0, 0)、II(0, 1, 0)、III(0, 0, 1)、IV(0, 0, 0)。 (a) What does β₁ mean? (5%) (b) What does β₁ − β₂ mean? (5%) (c) State how to establish a classification rule based on the model given above. (10%)", "pts": 5}, {"label": "3", "sect": "問答", "text": "Consider the multivariate paired comparisons for two variables. (a) State the null hypothesis. (10%) (b) State how to test the null hypothesis. (10%)", "pts": 10}, {"label": "4", "sect": "問答", "text": "Consider the profile analysis with four response variables and two groups. (a) State the null hypothesis of parallel profiles. (10%) (b) State how to test the null hypothesis. (10%)", "pts": 10}, {"label": "5", "sect": "問答", "text": "It is desired to regress Y on X1, X2, …, X10. However, it has been found that some of the explanatory variables (X1, X2, …, X10) are highly correlated, leading to severe collinearity. If it is required to keep the information of the explanatory rence between crossed designs and nested designs.", "pts": 10}, {"label": "3", "sect": "問答", "text": "State how to build a classification rule for a binary logistic regression model.", "pts": 10}, {"label": "4", "sect": "問答", "text": "Explain why multivariate paired comparisons can be regarded as a special case of a repeated-measures design.", "pts": 10}, {"label": "5", "sect": "問答", "text": "Give two approaches for assessing discriminant validity.", "pts": 10}]}};</script>

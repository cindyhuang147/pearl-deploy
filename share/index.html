<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>珍珠日記</title>
<style>
 :root{--bg:#FAF6EF;--surface:#FFFFFF;--surface2:#F2ECE1;--ink:#3E3A34;--muted:#7A7264;--hint:#A89E8C;--line:#E2D9CA;
   --sage:#5B6C5D;--clay:#B07A5A;--olive:#6B7257;--gold:#A07D4B;--teal:#1D9E75;--purple:#7F77DD;--ok:#1D9E75;--no:#C0503A;--pink:#D88C9A;}
 @media (prefers-color-scheme:dark){:root{--bg:#23211D;--surface:#2C2A25;--surface2:#332F28;--ink:#EDE7DA;--muted:#B5AC9C;
   --hint:#8A8170;--line:#3D392F;--sage:#8FA38F;--clay:#D29B7B;--olive:#9DAA86;--gold:#C9A66B;--teal:#3CB98C;--ok:#3CB98C;--no:#D9745C;--pink:#E0A6B2;}}
 *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;line-height:1.7;font-size:16px;}
 .wrap{max-width:720px;margin:0 auto;padding:16px 16px 70px;}
 .card{background:var(--surface);border:.5px solid var(--line);border-radius:14px;padding:16px;margin-bottom:13px;}
 .soft{background:var(--surface2);border-radius:12px;padding:12px 14px;}
 h1{font-size:22px;font-weight:600;margin:0;} h2{font-size:16px;font-weight:600;margin:0 0 8px;}
 .sub{font-size:13px;color:var(--muted);} .mini{font-size:12px;color:var(--hint);}
 .row{display:flex;gap:10px;flex-wrap:wrap;}
 button{font-family:inherit;font-size:15px;border-radius:10px;border:.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer;min-height:44px;}
 button:active{transform:scale(.98);} .primary{background:var(--sage);color:#FAF6EF;border-color:var(--sage);}
 textarea,input{font-family:inherit;font-size:15px;width:100%;border:.5px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);resize:vertical;}
 .metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;}
 .metric{background:var(--surface2);border-radius:10px;padding:8px 4px;text-align:center;}
 .metric .v{font-size:20px;font-weight:600;} .metric .l{font-size:11px;color:var(--muted);}
 .entry{border-left:3px solid var(--teal);background:var(--surface);border:.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:8px;}
 .entry .t{font-size:12px;color:var(--hint);} .entry .b{font-size:14.5px;margin-top:2px;}
 .pin{border-left-color:var(--gold);background:var(--surface2);}
 .wk{cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 11px;background:var(--surface2);border-radius:10px;}
 .day{display:flex;gap:9px;align-items:flex-start;padding:8px 9px;border:.5px solid var(--line);border-radius:9px;margin-top:6px;cursor:pointer;}
 .chk{flex:0 0 auto;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;}
 .chk.on{background:var(--teal);border-color:var(--teal);}
 a.copy{font-size:12px;color:var(--muted);text-decoration:none;cursor:pointer;}
 .opt{display:block;width:100%;text-align:left;margin:7px 0;padding:11px 13px;white-space:normal;line-height:1.5;}
 .opt.ok{background:#E1F5EE;border-color:var(--ok);color:#0F6E56;} .opt.no{background:#FAE7E1;border-color:var(--no);color:#8a3a26;} .opt.selp{background:var(--surface2);border-color:var(--muted);}
 @media (prefers-color-scheme:dark){.opt.ok{background:#163a30;color:#7fe0bf;}.opt.no{background:#3a201a;color:#f0a78f;}}
 .pill{font-size:12px;padding:3px 9px;border-radius:8px;background:var(--surface2);color:var(--muted);}
 .ttl{cursor:pointer;padding:10px 12px;border:.5px solid var(--line);border-radius:10px;margin-bottom:7px;display:flex;justify-content:space-between;gap:8px;align-items:center;}
 .count{background:var(--surface2);border-radius:14px;padding:12px 14px;text-align:center;margin-bottom:13px;}
 .count .big{font-size:30px;font-weight:600;color:var(--clay);line-height:1.1;}
 .catwrap{text-align:center;}
 .cat{display:inline-block;animation:bob 3.4s ease-in-out infinite;transform-origin:center bottom;cursor:pointer;}
 .cat.wig{animation:wig .55s ease;}
 @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
 @keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
 @keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
 @keyframes tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(10deg)}}
 @keyframes tailf{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(14deg)}}
 @keyframes fly{0%{opacity:0;transform:translateY(6px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-46px) scale(1.1)}}
 .eyes{transform-origin:center;animation:blink 5s infinite;}
 .tl{transform-origin:24px 120px;animation:tail 2.6s ease-in-out infinite;}
 .tlf{transform-origin:24px 120px;animation:tailf 1s ease-in-out infinite;}
 .hrt{animation:fly 2.6s ease-in infinite;}
 .lvbar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden;}
 .lvfill{height:100%;background:var(--gold);}
 .bdg{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 9px;border-radius:9px;border:.5px solid var(--line);}
 .bdg.on{background:#FAEEDA;color:#854F0B;border-color:#E9CB8E;} .bdg.off{opacity:.45;}
</style></head><body><div class="wrap" id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script>try{firebase.initializeApp({apiKey:"AIzaSyD6Wly2tuEkRSwlM-gf-7GpV_AV8GeMJ5c",authDomain:"pearl-diary-shihan.firebaseapp.com",projectId:"pearl-diary-shihan",storageBucket:"pearl-diary-shihan.firebasestorage.app",messagingSenderId:"239508958239",appId:"1:239508958239:web:c8e2a2b1a4958c8d69b92a"});window._db=firebase.firestore();}catch(e){window._db=null;}</script>
<script>window.RM=[{"label": "1051（105學年第1學期，2016/11/30）", "qs": [{"n": "1", "q": "When is deductive reasoning used in the research process?", "opts": ["(A) In developing hypotheses.", "(B) In generalizing results to the population.", "(C) In developing a theory.", "(D) All of the above."], "ans": "D", "note": "演繹推理貫穿假設建立(A)、統計推論(B)、理論發展(C)，全部皆是", "cat": "研究哲學"}, {"n": "2", "q": "Hypotheses cannot be proven to be true because the next study might refute them. This is known as…", "opts": ["(A) The problem of induction", "(B) The problem of replication", "(C) The problem of proof", "(D) The problem of deduction"], "ans": "A", "note": "歸納問題（problem of induction）：無法100%透過有限觀察確認理論為真", "cat": "理論與假設"}, {"n": "3", "q": "One term is defined as a bundle of meanings or characteristics associated with certain events, objects, conditions…", "opts": ["(A) Construct", "(B) Definition", "(C) Concept", "(D) Variable"], "ans": "C", "note": "Concept（概念）：與事物相關的意義或特徵集合；Construct是為研究目的特別發明的", "cat": "其他"}, {"n": "4", "q": "This is an idea or image specifically invented for a given research and/or theory building purpose", "opts": ["(A) Concept", "(B) Construct", "(C) Definition", "(D) Variables"], "ans": "B", "note": "Construct（建構）：為研究或建立理論目的而特別發明的概念", "cat": "理論與假設"}, {"n": "5", "q": "Which of the following is true?", "opts": ["(A) Shorter scales → greater internal reliability but lower reliability over time.", "(B) Longer scales → lower internal reliability and lower reliability over time.", "(C) Longer scales → higher internal reliability and lower reliability over time.", "(D) Shorter scales → lower internal reliability but higher reliability over time."], "ans": "C", "note": "題數多→內部一致性高（Cronbach α↑），但穩定性（test-retest）可能因記憶效應降低", "cat": "信度"}, {"n": "6", "q": "Using a properly calibrated set of bathroom scales to measure mood would be:", "opts": ["(A) Reliable but not valid", "(B) Valid but not reliable.", "(C) Reliable and valid.", "(D) Neither reliable nor valid."], "ans": "A", "note": "體重計精確測量體重（reliable），但無法測量情緒（not valid）", "cat": "信度"}, {"n": "7", "q": "If a measure is based on a full and close examination of the underlying concept and related theoretical approaches, it has high…", "opts": ["(A) Construct validity.", "(B) Face validity.", "(C) Content validity.", "(D) Convergent validity."], "ans": "C", "note": "內容效度（Content validity）：基於完整審視底層概念及理論建立測量工具", "cat": "效度"}, {"n": "8", "q": "Which of the following is true about ecological validity?", "opts": ["(A) Ecological validity refers to how much a study's methods resemble real-life situations.", "(B) All laboratory experiments have low ecological validity.", "(C) Ecological validity refers to the applicability of findings to the real world.", "(D) None of the other answers is correct."], "ans": "A", "note": "生態效度：研究方法與真實情境的相似程度；(C)是外部效度不是生態效度", "cat": "效度"}, {"n": "9", "q": "The difference between a measure and an indicator is that:", "opts": ["(A) measures are unambiguous quantities, whereas indicators are devised from common sense.", "(B) indicators have a more direct relationship to the underlying concept than measures.", "(C) indicators are unmistakable quantities, whereas measures are subjective.", "(D) measures are devised and then applied as if they were direct indicators of a concept."], "ans": "D", "note": "Measures是設計出來的，然後被當作直接指標（indicator）使用", "cat": "其他"}, {"n": "10", "q": "What effect does increasing the sample size have upon the sampling error?", "opts": ["(A) It reduces the sampling error.", "(B) It increases the sampling error.", "(C) It has no effect.", "(D) None of the above."], "ans": "A", "note": "樣本數↑→抽樣誤差↓（標準誤 SE = σ/√n）", "cat": "抽樣"}, {"n": "11", "q": "Which of the following is not a type of non-probability sampling?", "opts": ["(A) Snowball sampling", "(B) Stratified random sampling", "(C) Quota sampling", "(D) Convenience sampling"], "ans": "B", "note": "分層隨機抽樣是機率抽樣；Snowball/Quota/Convenience皆為非機率抽樣", "cat": "抽樣"}, {"n": "12", "q": "You should avoid using double-barrelled questions in a survey because:", "opts": ["(A) a respondent should only have one surname.", "(B) they make the questions too long.", "(C) they are too abstract.", "(D) they confuse respondents by asking about two different things."], "ans": "D", "note": "雙重問題一次問兩件事，受訪者不知該回應哪一個", "cat": "問卷與調查"}, {"n": "13", "q": "What is the role of the moderator in a focus group?", "opts": ["(A) To stimulate discussion and keep the conversation on track.", "(B) To ask leading questions and dominate the discussion.", "(C) To sit away from the group and observe their behaviour.", "(D) To evaluate the group's performance on a particular task."], "ans": "A", "note": "主持人（moderator）：引導並維持焦點團體討論方向", "cat": "質性研究"}, {"n": "14", "q": "How might quantitative research support qualitative research?", "opts": ["(A) By identifying specific groups of people to be interviewed.", "(B) By utilising a rigorous positivist framework.", "(C) By combining laboratory experiments with structured observation.", "(D) By showing the occurrence of different responses to a survey."], "ans": "A", "note": "量化先找出特定群體，再進行質化訪談（循序混合研究）", "cat": "實驗設計"}, {"n": "15", "q": "What is positivism?", "opts": ["(A) A dialogical process between theory and empirical phenomenon.", "(B) An epistemological position advocating the application of natural science methods to social reality.", "(C) A way of thinking about the research process and staying positive.", "(D) An outlook in life about seeing things positively."], "ans": "B", "note": "實証主義（positivism）：認識論立場，主張用自然科學方法研究社會現實", "cat": "研究哲學"}]}, {"label": "1052（105學年第2學期，2017/4/28）", "qs": [{"n": "1", "q": "A researcher divides the population of product users into three groups based on degree of use, then draws a random sample from each group independently. This is a _____ sample.", "opts": ["(a) random", "(b) stratified", "(c) judgment", "(d) group data", "(e) quota"], "ans": "b", "note": "依特性分層後各層隨機抽樣 = 分層隨機抽樣（stratified random sampling）", "cat": "抽樣"}, {"n": "2", "q": "A researcher is concerned with a nominal scale identifying users vs. nonusers of bank credit cards. The appropriate measure of central tendency is the", "opts": ["(a) mean.", "(b) median.", "(c) mode.", "(d) average.", "(e) range."], "ans": "c", "note": "名義尺度（nominal）：只能使用眾數（mode）作為集中趨勢", "cat": "統計與測量"}, {"n": "3", "q": "Stratified random sampling is a method in which", "opts": ["(a) the sample is first divided into strata, then random samples taken from each.", "(b) various strata are selected from the sample.", "(c) the population is first divided into strata, then random samples drawn from each.", "(d) None of these alternatives is correct."], "ans": "c", "note": "分層隨機：先將母體分層，再從各層隨機抽樣（非先分樣本）", "cat": "抽樣"}, {"n": "4", "q": "Cluster sampling is", "opts": ["(a) a nonprobability sampling method", "(b) the same as convenience sampling", "(c) a probability sampling method", "(d) None of these alternatives is correct."], "ans": "c", "note": "群集抽樣是機率抽樣（隨機選取群集）", "cat": "抽樣"}, {"n": "5", "q": "A researcher wants to estimate coffee consumption within ±0.4 lbs. at two-sigma level; SD of cluster means = 3. How many clusters needed?", "opts": ["(a) 10", "(b) 20", "(c) 60", "(d) 230"], "ans": "d", "note": "n = (Z×σ/E)² = (2×3/0.4)² = 225 ≈ 最接近230", "cat": "抽樣"}, {"n": "6", "q": "The purpose of stratified random sampling is to make certain that", "opts": ["(a) every member has an equal chance of being selected.", "(b) the sample proportionately represents individuals from different categories.", "(c) participants most likely to react to treatment are chosen.", "(d) the sample is more representative than accessible population."], "ans": "b", "note": "分層抽樣目的：確保樣本按比例代表母體各類別", "cat": "抽樣"}, {"n": "7", "q": "Which problem with data collection might be attributed to sampling error?", "opts": ["(a) A very low response rate to a postal questionnaire.", "(b) Badly designed questions.", "(c) Incorrect data entry.", "(d) Bias due to an inappropriate choice of respondents."], "ans": "d", "note": "抽樣誤差來源：樣本選擇不當導致的偏誤；(a)(b)(c)是非抽樣誤差", "cat": "抽樣"}, {"n": "8", "q": "Which of the following refers to Inter-rater reliability?", "opts": ["(a) The degree to which two tests measure the same construct.", "(b) The degree to which a clinician can predict future behaviour.", "(c) The degree to which two clinicians agree on interpretation or scoring.", "(d) The degree to which items in the test relate to each other."], "ans": "c", "note": "評分者間信度（inter-rater）：兩位評分者對同一測試給分的一致程度", "cat": "信度"}, {"n": "9", "q": "Why might test-retest reliability become less important?", "opts": ["(a) If participants become familiar with a test.", "(b) If convergent validity was not high.", "(c) If alternate-form reliability cannot be calculated.", "(d) If the concept measured is not expected to be stable over time (e.g. mood)."], "ans": "d", "note": "當被測概念本身不穩定（如情緒），重測不一致是正常的，test-retest不重要", "cat": "信度"}, {"n": "10", "q": "The split-half method is used as a test of:", "opts": ["(a) Stability", "(b) Internal reliability", "(c) Inter-observer consistency", "(d) External validity"], "ans": "b", "note": "折半法（split-half）：測試內部信度（internal reliability）", "cat": "信度"}, {"n": "11", "q": "Face validity refers to which of the following:", "opts": ["(a) Facial expression is used to make a diagnosis.", "(b) The scale of emotional responding.", "(c) An assessment method may appear valid simply because questions intuitively seem relevant.", "(d) A construct is a hypothetical attribute that may not be directly observable."], "ans": "c", "note": "表面效度（face validity）：測量工具表面上看起來與欲測概念相關的程度", "cat": "效度"}, {"n": "12", "q": "Which is content-related evidence of validity?", "opts": ["(a) Test items are at an appropriate reading level.", "(b) Observed participant characteristics are consistent with responses on a scale.", "(c) Scores obtained on two administrations are consistent.", "(d) Scores are correlated with scores on another instrument."], "ans": "a", "note": "內容效度證據：題目閱讀程度適當（反映概念內容範疇）；(c)是信度；(d)是效標效度", "cat": "效度"}, {"n": "13", "q": "A statistical technique for studying interrelationships among variables for data reduction and discovery of latent dimensions is known as:", "opts": ["(a) Multiple regression", "(b) Factor analysis", "(c) Discriminant analysis", "(d) Canonical correlation"], "ans": "b", "note": "因素分析（Factor analysis）：資料縮減與發現潛在構念的統計技術", "cat": "效度"}, {"n": "14", "q": "To determine which variables relate to which factors, a researcher would use:", "opts": ["(a) Factor loadings", "(b) Communalities", "(c) Eigen values", "(d) Beta coefficients"], "ans": "a", "note": "Factor loadings（因素負荷量）：變數與因素的相關係數", "cat": "因素分析"}, {"n": "15", "q": "To determine the amount of variance in the original variables associated with a factor:", "opts": ["(a) Factor loadings", "(b) Communalities", "(c) Eigen values", "(d) Beta coefficients", "(e) None of these."], "ans": "b", "note": "Communalities（共同性）：每個變數被所有因素解釋的總變異比例", "cat": "因素分析"}, {"n": "16", "q": "If a researcher uses factor rotation, what will be the likely outcome:", "opts": ["(a) Loadings CHANGE, total variance SAME.", "(b) Loadings same, variance same.", "(c) Loadings change, variance also changes.", "(d) Loadings same, variance changes."], "ans": "a", "note": "★超高頻：轉軸改變loading分配，但總解釋變異量不變", "cat": "因素分析"}, {"n": "17", "q": "Which is an orthogonal rotation in factor analysis:", "opts": ["(a) Oblimin", "(b) Oblimax", "(c) Oblique", "(d) Varimax", "(e) None of these."], "ans": "d", "note": "★超高頻：Varimax是正交（orthogonal）轉軸；Oblimin/Oblimax/Oblique是斜交", "cat": "因素分析"}, {"n": "18", "q": "The total of all eigen values will equal:", "opts": ["(a) 1", "(b) 50", "(c) 100", "(d) The number of variables in the analysis", "(e) Impossible to tell."], "ans": "d", "note": "特徵值加總 = 變數總數（每個標準化變數貢獻1單位變異量）", "cat": "因素分析"}, {"n": "19", "q": "When no interaction occurs in a complex design with two IVs, the…", "opts": ["(a) effects of each IV must be interpreted differently.", "(b) effects of each IV can be generalized across levels of the other IV.", "(c) internal validity of each IV is increased.", "(d) sensitivity of the overall experiment is decreased."], "ans": "b", "note": "無交互作用：各自變數效果可跨另一變數水準進行概化", "cat": "效度"}, {"n": "20", "q": "A 2x2 factorial study: dating status (Dater/Nondater) × partner interest (In Participant/In Friend). Dater: 10,14; Nondater: 8,4. Which effects?", "opts": ["(a) Main effect of Dating Status only.", "(b) Main effect of Potential Dating Partner only.", "(c) Interaction between Dating Status and Partner.", "(d) Both main effects but not interaction.", "(e) One main effect and the interaction."], "ans": "f", "note": "Dater列(10,14)：14-10=4↑；Nondater列(8,4)：4-8=-4↓ → 有交互作用；兩個主效果也都存在", "cat": "因素分析"}, {"n": "21", "q": "Which occurs when the effect of one IV differs depending on the level of a second IV?", "opts": ["(a) Main effect", "(b) Interaction effect", "(c) Differential effect", "(d) Ceiling effect", "(e) None."], "ans": "b", "note": "交互作用（Interaction effect）：一個自變數的效果因另一個自變數的水準而改變", "cat": "實驗設計"}, {"n": "22", "q": "When IV1 (task difficulty) interacts with IV2 (age), the generality of IV1 is…", "opts": ["(a) increased.", "(b) unaffected.", "(c) decreased.", "(d) irrelevant."], "ans": "c", "note": "有交互作用→主效果的普遍性降低，不能直接推論", "cat": "其他"}, {"n": "23", "q": "As an approach to knowledge, the scientific method relies on…", "opts": ["(a) intuitive procedures.", "(b) deductive procedures.", "(c) empirical procedures.", "(d) subjective procedures."], "ans": "c", "note": "科學方法依賴實徵程序（empirical）：透過觀察和實驗獲取知識", "cat": "研究哲學"}, {"n": "24", "q": "The tentative explanations scientists use that must be testable are called…", "opts": ["(a) hypotheses.", "(b) postulates.", "(c) heuristics.", "(d) axioms."], "ans": "a", "note": "假設（hypotheses）：暫時性且可被檢定的解釋", "cat": "理論與假設"}, {"n": "25", "q": "Using the nomothetic approach, psychologists seek to…", "opts": ["(a) describe one individual's behavior.", "(b) create change in an individual's life.", "(c) identify a research question.", "(d) establish general laws of behavior that apply to a diverse population."], "ans": "d", "note": "律則性方法（nomothetic）：建立適用於廣大母體的一般性行為法則", "cat": "研究哲學"}]}, {"label": "1061（106學年第1學期，2017/12/1）", "qs": [{"n": "1", "q": "Questionnaires can address events and characteristics taking place when?", "opts": ["(A) In the past.", "(B) In the present.", "(C) In the future.", "(D) All of the above.", "(E) None of the above."], "ans": "D", "note": "問卷可問過去（回溯）、現在、未來（預期）的事件", "cat": "問卷與調查"}, {"n": "2", "q": "Which of these is not a method of data collection?", "opts": ["(A) Questionnaires.", "(B) Interviews.", "(C) Experiments.", "(D) Observations.", "(E) None of the above."], "ans": "E", "note": "以上皆是資料收集方法（注意：答E = None of the above，意指無例外）", "cat": "實驗設計"}, {"n": "3", "q": "An item directing participants to different follow-up questions depending on response is called a ___?", "opts": ["(A) response set.", "(B) probe.", "(C) semantic differential.", "(D) contingency question.", "(E) None."], "ans": "D", "note": "Contingency question（條件式問題）：依回答導向不同後續問題", "cat": "問卷與調查"}, {"n": "4", "q": "Which is true concerning observation?", "opts": ["(A) Takes less time than self-report.", "(B) Costs less money.", "(C) It is often not possible to determine exactly why people behave as they do.", "(D) All of the above.", "(E) None."], "ans": "C", "note": "觀察法：通常無法確定行為的原因（why）；(A)(B)通常相反", "cat": "質性研究"}, {"n": "5", "q": "A question like \"Why do you feel that way\" in an interview is known as a:", "opts": ["(A) prob.", "(B) filter question.", "(C) response.", "(D) pilot.", "(E) None."], "ans": "A", "note": "Probe（追問）：引導受訪者深入說明", "cat": "問卷與調查"}, {"n": "6", "q": "How would you define the research process?", "opts": ["(A) The researcher's plan of action.", "(B) A method of collecting data.", "(C) The stages or steps the researcher follows in carrying out a research project.", "(D) The account the researcher will write for publication.", "(E) None."], "ans": "C", "note": "研究過程：研究者執行研究項目所遵循的階段或步驟", "cat": "研究流程與倫理"}, {"n": "7", "q": "Which two uses for empiricism are correct?", "opts": ["(A) Measures using empirical metric; study of scientific phenomenon.", "(B) Study of scientific phenomenon; accumulation of facts.", "(C) Measures using empirical metric; origins in empirical court.", "(D) Knowledge through experience and senses; accumulation of facts is legitimate.", "(E) None."], "ans": "D", "note": "經驗主義：知識源自感官經驗；累積事實是合法目標", "cat": "研究哲學"}, {"n": "8", "q": "The research process can be compared to which of the following?", "opts": ["(A) A train timetable.", "(B) The spine of a skeleton.", "(C) The problem-solving process.", "(D) Nursing theories.", "(E) None."], "ans": "C", "note": "研究過程類似問題解決過程（有系統的步驟）", "cat": "研究流程與倫理"}, {"n": "9", "q": "What does the term ontology mean?", "opts": ["(A) The term ontology is concerned with the nature of social entities.", "(B) The study of cancer.", "(C) The study of the onto tribe.", "(D) Research into ontogeny.", "(E) None."], "ans": "A", "note": "本體論（ontology）：關注社會實體的本質（客觀存在vs社會建構）", "cat": "研究哲學"}, {"n": "10", "q": "A paradigm is:", "opts": ["(A) a research tool.", "(B) a cluster of beliefs and dictates which influence what should be studied, how research should be done, and how results should be interpreted.", "(C) a set of students in a study group.", "(D) a research strategy.", "(E) None."], "ans": "B", "note": "★高頻：典範（paradigm）= 信念與規範的集合體，影響研究取向", "cat": "研究哲學"}, {"n": "11", "q": "The purpose of the research proposal is:", "opts": ["(A) To generate monetary sources.", "(B) To present management question to be researched and its importance.", "(C) To discuss the research efforts of others.", "(D) To criticize others.", "(E) None."], "ans": "B", "note": "研究提案目的：呈現待研究的管理問題及其重要性", "cat": "研究流程與倫理"}, {"n": "12", "q": "To determine which variables were associated with which factors, a researcher would look at:", "opts": ["(A) Factor scores.", "(B) Factor loadings.", "(C) Factors.", "(D) Factor associations.", "(E) None."], "ans": "B", "note": "Factor loadings：決定哪些變數與哪些因素相關", "cat": "因素分析"}, {"n": "13", "q": "Which can be used to determine how many factors to take from a factor analysis:", "opts": ["(A) Eigen values.", "(B) Scree plots.", "(C) Percentage of variance.", "(D) All of the above.", "(E) None."], "ans": "D", "note": "決定因素個數三方法：特徵值(>1)、陡坡圖、累積解釋變異量（皆可）", "cat": "因素分析"}, {"n": "14", "q": "If factor rotation is used, what will be the likely outcome:", "opts": ["(A) Loadings change, total variance SAME.", "(B) Loadings same, variance same.", "(C) Loadings change, variance also changes.", "(D) Loadings same, variance changes.", "(E) None."], "ans": "A", "note": "★超高頻：轉軸後loading模式改變，但總解釋變異量不變", "cat": "因素分析"}, {"n": "15", "q": "Which is an orthogonal rotation in factor analysis:", "opts": ["(A) Oblimin.", "(B) Oblimax.", "(C) Oblique.", "(D) Varimax.", "(E) None."], "ans": "D", "note": "★超高頻：Varimax = 正交轉軸；其他三者為斜交", "cat": "因素分析"}, {"n": "16", "q": "Subjects are said to be assigned randomly when", "opts": ["(A) assigned from a representative sample.", "(B) each has an equal chance of being assigned to either group.", "(C) assigned so groups differ on some critical variable before experiment.", "(D) neither experimenter nor subject knows group assignment.", "(E) None."], "ans": "B", "note": "隨機分派：每人有相等機率被分至實驗組或對照組", "cat": "實驗設計"}, {"n": "17", "q": "A friend taking vitamin C has not had a cold. His observation has little value because", "opts": ["(A) there was no control group for comparison.", "(B) he has not calculated a correlation coefficient.", "(C) of the effect of the observer on the observed.", "(D) he does not specify his dosage.", "(E) None."], "ans": "A", "note": "無對照組→無法確認因果，可能是自然痊癒或其他因素", "cat": "實驗設計"}, {"n": "18", "q": "A simple experiment has two groups called", "opts": ["(A) The dependent group and the independent group.", "(B) The extraneous group and the independent group.", "(C) The before group and the after group.", "(D) The control group and the experimental group.", "(E) None."], "ans": "D", "note": "簡單實驗：控制組（control）與實驗組（experimental）", "cat": "實驗設計"}, {"n": "19", "q": "A variable like personality that might affect the experiment would be controlled by", "opts": ["(A) random assignment of subjects.", "(B) assuming effects negligible.", "(C) manipulating dependent variables simultaneously.", "(D) repeating the experiment.", "(E) None."], "ans": "A", "note": "控制外在變數：透過隨機分派（random assignment）達成", "cat": "實驗設計"}, {"n": "20", "q": "In a factorial design, a main effect is the __________.", "opts": ["(A) combined effect of all IVs.", "(B) interaction effect of IVs.", "(C) the effect of each IV on the DV.", "(D) interaction of the IVs.", "(E) None."], "ans": "C", "note": "主效果（main effect）：每個自變數單獨對依變數的效果", "cat": "因素分析"}]}, {"label": "1062（106學年第2學期，2018/5/1）", "qs": [{"n": "1", "q": "Which statement is correct about self-completion questionnaires?", "opts": ["A) Self-completion questionnaires are a type of postal survey.", "B) Postal surveys can include self-completion or email surveys.", "C) Self-completion questionnaires can include postal or email surveys.", "D) Email surveys are a type of postal questionnaire.", "E) None."], "ans": "C", "note": "自填式問卷（self-completion）可包含郵寄或電子郵件形式", "cat": "問卷與調查"}, {"n": "2", "q": "One advantage of self-completion questionnaires over structured interviews is:", "opts": ["A) They are quicker and cheaper to administer.", "B) They create interviewer effects.", "C) They have greater measurement validity.", "D) They are less prone to inter-coder variation.", "E) None."], "ans": "A", "note": "自填式優點：省時省錢；(B)是缺點；(C)(D)通常相反", "cat": "效度"}, {"n": "3", "q": "Which is NOT a disadvantage of self-completion questionnaires compared to structured interviews?", "opts": ["A) The respondent can read the whole questionnaire before answering.", "B) The researcher cannot ask many closed-ended questions.", "C) The researcher cannot probe or prompt respondents.", "D) The respondent may not answer all questions.", "E) None."], "ans": "B", "note": "「無法問很多封閉題」不是自填式問卷的缺點，反而可以設計很多封閉題", "cat": "問卷與調查"}, {"n": "4", "q": "For a nominal scale identifying users vs. nonusers, appropriate central tendency is…", "opts": ["A) mean.", "B) median.", "C) mode.", "D) average.", "E) range."], "ans": "C", "note": "名義尺度只能用眾數（mode）", "cat": "統計與測量"}, {"n": "5", "q": "Parameters are", "opts": ["A) numerical characteristics of a sample.", "B) the averages taken from a sample.", "C) numerical characteristics of either a sample or a population.", "D) numerical characteristics of a population.", "E) none."], "ans": "D", "note": "參數（parameters）：母體的數值特徵（vs.統計量statistic是樣本的）", "cat": "統計與測量"}, {"n": "6", "q": "Convenience sampling is an example of…", "opts": ["A) probabilistic sampling", "B) stratified sampling", "C) nonprobabilistic sampling", "D) cluster sampling", "E) none."], "ans": "C", "note": "便利抽樣是非機率抽樣", "cat": "抽樣"}, {"n": "7", "q": "Which is an example of nonprobabilistic sampling?", "opts": ["A) simple random sampling", "B) stratified simple random sampling", "C) cluster sampling", "D) judgment sampling", "E) none."], "ans": "D", "note": "判斷抽樣（judgment sampling）= 立意抽樣，是非機率抽樣", "cat": "抽樣"}, {"n": "8", "q": "Stratified random sampling is a method in which", "opts": ["A) sample first divided, then random samples from each stratum.", "B) various strata selected from the sample.", "C) population first divided into strata, then random samples drawn from each.", "D) None.", "E) none."], "ans": "C", "note": "★重複高頻：先將母體分層，再各層隨機抽", "cat": "抽樣"}, {"n": "9", "q": "A simple random sample from an infinite population is selected such that…", "opts": ["A) each element is selected independently and from the same population.", "B) each element has 0.5 probability of being selected.", "C) each has probability of at least 0.5.", "D) probability of being selected changes.", "E) none."], "ans": "A", "note": "簡單隨機抽樣：每個元素獨立且從同一母體中被抽取", "cat": "抽樣"}, {"n": "10", "q": "A population characteristic, such as a population mean, is called…", "opts": ["A) a statistic", "B) a parameter", "C) a sample", "D) the mean deviation", "E) none."], "ans": "B", "note": "母體特徵 = 參數（parameter）；樣本特徵 = 統計量（statistic）", "cat": "統計與測量"}, {"n": "11", "q": "A statistical technique for data reduction and discovery of latent constructs is:", "opts": ["A) Multiple regression", "B) Factor analysis", "C) Discriminant analysis", "D) Canonical correlation", "E) None."], "ans": "B", "note": "因素分析（Factor analysis）", "cat": "效度"}, {"n": "12", "q": "To determine which variables relate to which factors:", "opts": ["A) Factor loadings", "B) Communalities", "C) Eigen values", "D) Beta coefficients", "E) None."], "ans": "A", "note": "Factor loadings", "cat": "因素分析"}, {"n": "13", "q": "To determine variance in original variables associated with a factor:", "opts": ["A) Factor loadings", "B) Communalities", "C) Eigen values", "D) Beta coefficients", "E) None."], "ans": "B", "note": "Communalities（共同性）", "cat": "因素分析"}, {"n": "14", "q": "To determine which variables were associated with which factors:", "opts": ["A) Factor scores", "B) Factor loadings", "C) Factors", "D) Factor associations", "E) None."], "ans": "B", "note": "Factor loadings（同Q12，重複確認）", "cat": "因素分析"}, {"n": "15", "q": "Which can be used to determine how many factors to take from factor analysis:", "opts": ["A) Eigen values", "B) Scree plots", "C) Percentage of variance", "D) All of the above", "E) None."], "ans": "D", "note": "三者皆可用", "cat": "因素分析"}, {"n": "16", "q": "In EFA, percentage of variance criteria: cumulative percentage should be at least:", "opts": ["A) 30%", "B) 50%", "C) 60%", "D) 90%", "E) 100%"], "ans": "C", "note": "EFA中，社會科學研究通常要求累積解釋變異量至少達60%", "cat": "其他"}, {"n": "17", "q": "If factor rotation is used, likely outcome:", "opts": ["A) Loadings change, variance SAME.", "B) Loadings same, variance same.", "C) Loadings change, variance changes.", "D) Loadings same, variance changes.", "E) None."], "ans": "A", "note": "★超高頻：轉軸後loading改變，總解釋變異不變", "cat": "因素分析"}, {"n": "18", "q": "Which is an orthogonal rotation:", "opts": ["A) Oblimin", "B) Oblimax", "C) Oblique", "D) Varimax", "E) None."], "ans": "D", "note": "★Varimax = 正交", "cat": "因素分析"}, {"n": "19", "q": "Which is an oblique rotation in factor analysis:", "opts": ["A) Promax", "B) Oblimax", "C) Orthogonal", "D) Varimax", "E) None."], "ans": "A", "note": "Promax是斜交轉軸（oblique）；Varimax是正交；Orthogonal是正交的總稱", "cat": "因素分析"}, {"n": "20", "q": "The total of all eigen values should equal:", "opts": ["A) The number of scale items.", "B) Twice the number of variables.", "C) The number of scale items.", "D) The number of variables.", "E) Impossible to tell."], "ans": "D", "note": "特徵值加總 = 變數數目", "cat": "因素分析"}, {"n": "21", "q": "Natural experiments involve:", "opts": ["A) Data from animal studies.", "B) Data from events that cannot usually be manipulated in the lab.", "C) Observation studies.", "D) Data from naturist centres.", "E) None."], "ans": "B", "note": "自然實驗：研究通常無法在實驗室中操弄的自然發生事件", "cat": "實驗設計"}, {"n": "22", "q": "Which allows scholars to manipulate the independent variable?", "opts": ["A) Correlation", "B) Experimentation", "C) The dependent variable", "D) Internal validity", "E) None."], "ans": "B", "note": "只有實驗法（experimentation）可以操弄自變數", "cat": "效度"}, {"n": "23", "q": "Theoretically, random assignment should eliminate…", "opts": ["A) Sampling error.", "B) Common method biases.", "C) Concerns over validity.", "D) Many confounding variables.", "E) The need for a representative sample."], "ans": "D", "note": "隨機分派消除干擾變數（confounds），但不消除抽樣誤差", "cat": "抽樣"}, {"n": "24", "q": "Research participants are randomly assigned when", "opts": ["A) Assigned from representative sample.", "B) Each has equal chance of being in either group.", "C) Groups differ on critical variable before experiment.", "D) Neither experimenter nor subject knows group.", "E) None."], "ans": "B", "note": "★高頻：隨機分派 = 每人有相等機率", "cat": "實驗設計"}, {"n": "25", "q": "A friend taking vitamin C has not had a cold. His observation has little value because", "opts": ["A) There was no control group.", "B) He has not calculated correlation.", "C) Effect of observer on observed.", "D) He does not specify dosage.", "E) None."], "ans": "A", "note": "無對照組→無法確認因果", "cat": "實驗設計"}, {"n": "26", "q": "A simple experiment has two groups called", "opts": ["A) Dependent and independent group.", "B) Extraneous and independent group.", "C) Before and after group.", "D) Control and experimental group.", "E) None."], "ans": "D", "note": "控制組與實驗組", "cat": "實驗設計"}, {"n": "27", "q": "A variable like personality that might affect experiment would be controlled by", "opts": ["A) Random assignment.", "B) Assuming effects negligible.", "C) Manipulating dependent variables.", "D) Repeating the experiment.", "E) None."], "ans": "A", "note": "隨機分派控制外在變數", "cat": "實驗設計"}, {"n": "28", "q": "Two variables may be said to be causally related if", "opts": ["A) Strong positive correlation.", "B) All extraneous variables controlled and IV creates consistent differences.", "C) Observed to co-vary on many occasions.", "D) Observed in laboratory.", "E) None."], "ans": "B", "note": "因果關係：控制外在變數 + 自變數造成一致性差異", "cat": "統計與測量"}, {"n": "29", "q": "A random sample can best be defined as:", "opts": ["A) Each participant has equal chance of being selected.", "B) Characteristics correspond to larger population.", "C) Selection of cases from larger population.", "D) Selection from control group.", "E) From experimental group."], "ans": "A", "note": "隨機樣本：每個潛在參與者有相等機率被選中", "cat": "抽樣"}, {"n": "30", "q": "__________ designs are research designs with more than one independent variable.", "opts": ["A) Simple", "B) Monotonic", "C) Factorial", "D) Multi", "E) None."], "ans": "C", "note": "複因子設計（Factorial design）：超過一個自變數", "cat": "因素分析"}, {"n": "31", "q": "Music (yes/no) × room temperature (warm/cold) factorial design is:", "opts": ["A) 1×2", "B) 2×4", "C) 2×2", "D) 4×4", "E) 2×2×4"], "ans": "C", "note": "音樂有/無 × 溫度暖/冷 = 2×2 factorial", "cat": "因素分析"}, {"n": "32", "q": "In a 3×3 factorial design, how many conditions are there?", "opts": ["A) 2", "B) 3", "C) 6", "D) 9", "E) None."], "ans": "D", "note": "3×3 = 9個實驗條件", "cat": "因素分析"}, {"n": "33", "q": "A 2×2×4 factorial design: main effect of _________ IVs.", "opts": ["A) 2", "B) 3", "C) 4", "D) 8", "E) None."], "ans": "B", "note": "2×2×4有3個自變數，各有3個主效果", "cat": "因素分析"}, {"n": "34", "q": "In a factorial design, a main effect is the __________.", "opts": ["A) Combined effect of all IVs.", "B) Interaction effect of IVs.", "C) The effect of each IV on the DV.", "D) Interaction of the IVs.", "E) None."], "ans": "C", "note": "主效果：每個自變數單獨的效果", "cat": "因素分析"}, {"n": "35", "q": "A(n) ___________ between IVs indicates that the effect of one IV is different at different levels of the other IV.", "opts": ["A) main effect", "B) factorial effect", "C) interaction", "D) moderation", "E) None."], "ans": "C", "note": "交互作用（interaction）：一個IV的效果因另一個IV水準而不同", "cat": "因素分析"}, {"n": "36", "q": "A 2×3 design with 20 participants per condition: how many total participants?", "opts": ["A) 40", "B) 60", "C) 80", "D) 120", "E) None."], "ans": "D", "note": "2×3=6個條件 × 20人 = 120人", "cat": "其他"}, {"n": "37", "q": "How would an interaction be shown in a line graph?", "opts": ["A) as parallel lines.", "B) as intersecting lines.", "C) as overlapping lines.", "D) as diagonal lines.", "E) None."], "ans": "B", "note": "有交互作用 → 折線圖中線條交叉（非平行）", "cat": "實驗設計"}, {"n": "38", "q": "A 2×3 factorial experiment: professor interested in college major and study method. How many levels of study method?", "opts": ["A) 2", "B) 3", "C) 5", "D) 6", "E) None."], "ans": "B", "note": "2×3中第二個因子（study method）有3個水準", "cat": "因素分析"}, {"n": "39", "q": "Which is not normally included in a written account of qualitative research?", "opts": ["A) Introduction locating research in theoretical context.", "B) Explanation of the design of the study.", "C) Discussion of main findings in relation to research questions.", "D) A decision to accept or reject the hypothesis.", "E) None."], "ans": "D", "note": "質化研究不使用接受/拒絕虛無假設的框架", "cat": "質性研究"}, {"n": "40", "q": "What is rhetoric?", "opts": ["A) The type of rapport in in-depth interviews.", "B) An ancient form of poetry.", "C) A technique to assess external reliability of a data source.", "D) The attempt to persuade or convince an audience, often through writing.", "E) None."], "ans": "D", "note": "Rhetoric（修辭）：試圖說服受眾的技巧", "cat": "信度"}]}, {"label": "1071（107學年第1學期，2018/11/30）", "qs": [{"n": "1", "q": "The term \"secondary analysis\" refers to:", "opts": ["a. Conducting a study of seconds and minutes.", "b. Analysing your own data in two different ways.", "c. Analysing existing data collected by another person or organization.", "d. Working part time on a project."], "ans": "c", "note": "次級分析（secondary analysis）：分析他人或機構收集的現有資料", "cat": "質性研究"}, {"n": "2", "q": "Which is NOT an advantage of secondary analysis?", "opts": ["a. It immerses the researcher in the field.", "b. It tends to be based on high quality data.", "c. It provides an opportunity for longitudinal analysis.", "d. It allows you to study patterns over time."], "ans": "a", "note": "次級分析不能讓研究者沉浸於研究場域（這是田野研究的優點）", "cat": "質性研究"}, {"n": "3", "q": "Stratified random sampling is a method in which", "opts": ["a. sample first divided, then random from each stratum.", "b. various strata selected from the sample.", "c. population first divided into strata, then random from each.", "d. None."], "ans": "c", "note": "★高頻：母體先分層再各層隨機抽", "cat": "抽樣"}, {"n": "4", "q": "Cluster sampling is", "opts": ["a. a nonprobability method", "b. same as convenience sampling", "c. a probability method", "d. None."], "ans": "c", "note": "群集抽樣是機率抽樣", "cat": "抽樣"}, {"n": "5", "q": "What is the \"ecological fallacy\"?", "opts": ["a. Assumption that secondary analysis can be done at home.", "b. Mistake of observing people in their natural setting.", "c. Error of making inferences about individual behaviour from aggregate data.", "d. Myth that it is easy to research environmentalist groups."], "ans": "c", "note": "生態謬誤（ecological fallacy）：用總體資料推論個體行為", "cat": "效度"}, {"n": "6", "q": "The purpose of stratified random sampling is to make certain that", "opts": ["a. every member has equal chance.", "b. sample proportionately represents different categories.", "c. participants most likely to react are chosen.", "d. sample is more representative than accessible population."], "ans": "b", "note": "分層抽樣目的：按比例代表各類別", "cat": "抽樣"}, {"n": "7", "q": "Why has secondary analysis of official statistics been seen as \"unobtrusive\"?", "opts": ["a. Increases risk of reactive effects.", "b. Researcher is removed from the social settings investigated.", "c. Data collected for same purposes.", "d. Does not intrude into researcher's spare time."], "ans": "b", "note": "非干擾性：研究者不在現場，不影響研究對象", "cat": "質性研究"}, {"n": "8", "q": "Inter-rater reliability refers to:", "opts": ["a. Degree two tests measure same construct.", "b. Degree clinician can predict future behaviour.", "c. Degree two clinicians agree on scoring.", "d. Degree items relate to each other."], "ans": "c", "note": "★高頻：評分者間信度", "cat": "信度"}, {"n": "9", "q": "Test-retest reliability becomes less important when:", "opts": ["a. Participants become familiar with test.", "b. Convergent validity not high.", "c. Alternate-form reliability cannot be calculated.", "d. Concept not expected to be stable over time (e.g. mood)."], "ans": "d", "note": "★高頻：被測概念本身不穩定時，重測信度不適用", "cat": "信度"}, {"n": "10", "q": "The split-half method is a test of:", "opts": ["a. Stability", "b. Internal reliability", "c. Inter-observer consistency", "d. External validity"], "ans": "b", "note": "★高頻：折半法 = 內部信度", "cat": "信度"}, {"n": "11", "q": "Main difference between a focus group and a group interview?", "opts": ["a. Group interviews involve fewer participants.", "b. Focus groups are used to study the way people discuss a specific topic.", "c. There is no moderator present in a focus group.", "d. Focus groups save more time and money."], "ans": "b", "note": "焦點團體：研究人們如何討論特定主題（強調互動與團體動態）", "cat": "問卷與調查"}, {"n": "12", "q": "Which is content-related evidence of validity?", "opts": ["a. Test items at appropriate reading level.", "b. Observed participant characteristics consistent with responses.", "c. Scores on two administrations consistent.", "d. Scores correlated with another instrument."], "ans": "a", "note": "★高頻：內容效度證據 = 題目閱讀程度適當", "cat": "效度"}, {"n": "13", "q": "Why is it particularly difficult to get accurate transcript of a focus group?", "opts": ["a. Researcher forgets to take notes.", "b. Transcribed years later.", "c. Cannot use a tape recorder.", "d. Because there are so many different voices to follow."], "ans": "d", "note": "焦點團體多人同時發言，難以辨別各人聲音", "cat": "質性研究"}, {"n": "14", "q": "Advantage of qualitative interviewing relative to participant observation:", "opts": ["a. Allows you to find out about issues resistant to observation.", "b. More biased and value-laden.", "c. More likely to create reactive effects.", "d. None."], "ans": "a", "note": "質化訪談優點：可探討無法觀察到的議題（如過去經歷、私人想法）", "cat": "問卷與調查"}, {"n": "15", "q": "Disadvantage of qualitative interviewing relative to participant observation:", "opts": ["a. Has a more specific focus.", "b. More ethically dubious.", "c. May not provide access to deviant or hidden activities.", "d. Does not allow life events reconstruction.", "e. None."], "ans": "c", "note": "訪談缺點：難以接觸偏差或隱藏行為（相較於長期觀察）", "cat": "問卷與調查"}, {"n": "16", "q": "Which is a component of ethnographic research?", "opts": ["a. Being immersed in a social group or setting.", "b. Participant observation, interviews, and/or documentary analysis.", "c. A written account of the study.", "d. All of the above."], "ans": "d", "note": "民族誌（ethnography）包含沉浸、觀察/訪談/文件分析、書面記錄", "cat": "問卷與調查"}, {"n": "17", "q": "Which is an orthogonal rotation in factor analysis:", "opts": ["a. Oblimin", "b. Oblimax", "c. Oblique", "d. Varimax", "e. None."], "ans": "d", "note": "★超高頻：Varimax = 正交轉軸", "cat": "因素分析"}, {"n": "18", "q": "Name of the role where ethnographer joins in but admits to being a researcher:", "opts": ["a. Complete participant", "b. Participant-as-observer", "c. Observer-as-participant", "d. Complete observer", "e. All."], "ans": "b", "note": "Participant-as-observer（參與者作為觀察者）：加入活動但公開研究者身份", "cat": "質性研究"}, {"n": "19", "q": "Which is a problem associated with survey research?", "opts": ["a. The problem of objectivity.", "b. The problem of \"going native\".", "c. The problem of omission.", "d. The problem of robustness."], "ans": "c", "note": "問卷調查的問題：遺漏問題（respondents may skip questions）", "cat": "問卷與調查"}, {"n": "20", "q": "What is an observation schedule?", "opts": ["a. A set of explicit rules for assigning behaviour to categories.", "b. A timetable of observation days.", "c. A list of interview questions.", "d. A way of testing measurement validity."], "ans": "a", "note": "觀察排程（observation schedule）：將行為分類的明確規則", "cat": "效度"}, {"n": "21", "q": "Which occurs when effect of one IV differs depending on level of second IV?", "opts": ["a. Main effect", "b. Interaction effect", "c. Differential effect", "d. Ceiling effect", "e. None."], "ans": "b", "note": "★高頻：交互作用（Interaction effect）", "cat": "實驗設計"}, {"n": "22", "q": "When IV (task difficulty) interacts with IV2 (age), generality of IV1 is…", "opts": ["a. increased.", "b. unaffected.", "c. decreased.", "d. irrelevant."], "ans": "c", "note": "有交互作用→主效果的普遍性降低", "cat": "其他"}, {"n": "23", "q": "As an approach to knowledge, the scientific method relies on…", "opts": ["a. intuitive procedures.", "b. deductive procedures.", "c. empirical procedures.", "d. subjective procedures."], "ans": "c", "note": "科學方法依賴實徵程序", "cat": "研究哲學"}, {"n": "24", "q": "Tentative explanations scientists use that must be testable are called…", "opts": ["a. hypotheses.", "b. postulates.", "c. heuristics.", "d. axioms."], "ans": "a", "note": "假設（hypotheses）", "cat": "理論與假設"}, {"n": "25", "q": "Using the nomothetic approach, psychologists seek to…", "opts": ["a. describe one individual's behavior.", "b. create change in an individual.", "c. identify a research question.", "d. establish general laws of behavior that apply to a diverse population."], "ans": "d", "note": "律則性（nomothetic）：建立適用廣大母體的一般法則", "cat": "研究哲學"}, {"n": "26", "q": "A simple experiment has two groups called", "opts": ["a. Dependent and independent.", "b. Extraneous and independent.", "c. Before and after.", "d. Control and experimental.", "e. None."], "ans": "d", "note": "控制組與實驗組", "cat": "實驗設計"}, {"n": "27", "q": "A variable like personality would be controlled by", "opts": ["a. Random assignment.", "b. Assuming effects negligible.", "c. Manipulating dependent variables.", "d. Repeating experiment.", "e. None."], "ans": "a", "note": "隨機分派控制外在變數", "cat": "實驗設計"}, {"n": "28", "q": "Two variables causally related if", "opts": ["a. Strong positive correlation.", "b. Extraneous controlled, IV creates consistent differences.", "c. Observed to co-vary on many occasions.", "d. Observed in lab.", "e. None."], "ans": "b", "note": "因果關係的條件", "cat": "統計與測量"}, {"n": "29", "q": "A random sample can best be defined as:", "opts": ["a. Each participant has equal chance of being selected.", "b. Characteristics correspond to larger population.", "c. Selection of cases from larger population.", "d. Selection from control group.", "e. From experimental group."], "ans": "a", "note": "隨機樣本：每人有相等機率被選中", "cat": "抽樣"}, {"n": "30", "q": "One advantage of self-completion questionnaires over structured interviews:", "opts": ["a. Quicker and cheaper.", "b. Create interviewer effects.", "c. Greater measurement validity.", "d. Less prone to inter-coder variation.", "e. None."], "ans": "a", "note": "自填式：省時省錢", "cat": "效度"}]}, {"label": "1072（107學年第2學期，2019/4/26）", "qs": [{"n": "1", "q": "If factor rotation is used, likely outcome:", "opts": ["a. Loadings CHANGE, variance SAME.", "b. Loadings same, variance same.", "c. Loadings change, variance changes.", "d. Loadings same, variance changes."], "ans": "a", "note": "★超高頻：轉軸改變loading，總解釋變異不變", "cat": "因素分析"}, {"n": "2", "q": "Researcher divides population into three groups, draws random from each. This is a _____ sample.", "opts": ["a. random", "b. stratified", "c. judgment", "d. group data", "e. quota"], "ans": "b", "note": "★高頻：分層隨機抽樣", "cat": "抽樣"}, {"n": "3", "q": "Which is an orthogonal rotation:", "opts": ["a. Oblimin", "b. Oblimax", "c. Oblique", "d. Varimax", "e. none."], "ans": "d", "note": "★超高頻：Varimax = 正交", "cat": "因素分析"}, {"n": "4", "q": "Nominal scale, users vs. nonusers. Appropriate central tendency:", "opts": ["a. mean.", "b. median.", "c. mode.", "d. average.", "e. range."], "ans": "c", "note": "名義尺度 → 眾數（mode）", "cat": "統計與測量"}, {"n": "5", "q": "Which is an oblique rotation in factor analysis:", "opts": ["a. Oblimin", "b. Oblimax", "c. Oblique", "d. Varimax", "e. none."], "ans": "a", "note": "★重要：Oblimin是斜交轉軸（oblique rotation）最常用的方法", "cat": "因素分析"}, {"n": "6", "q": "Convenience sampling is an example of", "opts": ["a. probabilistic sampling", "b. stratified sampling", "c. nonprobabilistic sampling", "d. cluster sampling", "e. None."], "ans": "c", "note": "便利抽樣 = 非機率抽樣", "cat": "抽樣"}, {"n": "7", "q": "The total of all eigen values will equal:", "opts": ["a. 1", "b. 50", "c. 100", "d. The number of variables", "e. Impossible to tell."], "ans": "d", "note": "特徵值加總 = 變數總數", "cat": "因素分析"}, {"n": "8", "q": "Stratified random sampling is a method in which", "opts": ["a. sample first divided, then random from each.", "b. various strata selected from sample.", "c. population first divided, then random from each.", "d. None."], "ans": "c", "note": "母體先分層再各層抽", "cat": "抽樣"}, {"n": "9", "q": "Simple random sample from infinite population selected such that", "opts": ["a. each element independently from same population.", "b. each has 0.5 probability.", "c. each has probability of at least 0.5.", "d. probability of being selected changes."], "ans": "a", "note": "簡單隨機：每個元素獨立且從同一母體抽取", "cat": "抽樣"}, {"n": "10", "q": "A population characteristic, such as a population mean, is called", "opts": ["a. a statistic", "b. a parameter", "c. a sample", "d. the mean deviation"], "ans": "b", "note": "母體特徵 = 參數（parameter）", "cat": "統計與測量"}, {"n": "11", "q": "A sample statistic, such as a sample mean, is known as", "opts": ["a. a statistic", "b. a parameter", "c. the mean deviation", "d. the central limit theorem"], "ans": "a", "note": "樣本特徵 = 統計量（statistic）", "cat": "統計與測量"}, {"n": "12", "q": "A simple random sample of 28 observations, mean = 50. Fifty is a", "opts": ["a. population parameter", "b. biased estimate of population mean", "c. sample parameter", "d. point estimate"], "ans": "d", "note": "樣本均值50 = 點估計（point estimate）", "cat": "抽樣"}, {"n": "13", "q": "Cluster sampling is", "opts": ["a. nonprobability method", "b. same as convenience sampling", "c. probability method", "d. None."], "ans": "c", "note": "群集抽樣是機率抽樣", "cat": "抽樣"}, {"n": "14", "q": "Which represents an unrestricted method of sample element selection?", "opts": ["a. Systematic random sample", "b. Cluster random sample", "c. Simple random sample", "d. Quota sample"], "ans": "c", "note": "簡單隨機抽樣（simple random sampling）是最不受限制的抽樣方法", "cat": "抽樣"}, {"n": "15", "q": "The sampling frame", "opts": ["a. should be a listing of the population itself.", "b. is always prepared on random selection basis.", "c. details the sample selection procedure.", "d. is the list of items selected in the sample."], "ans": "a", "note": "抽樣架構（sampling frame）= 母體清單", "cat": "抽樣"}, {"n": "16", "q": "What does the term ontology mean?", "opts": ["a. Concerned with the nature of social entities.", "b. The study of cancer.", "c. The study of the onto tribe.", "d. Research into ontogeny."], "ans": "a", "note": "★高頻：本體論（ontology）關注社會實體的本質", "cat": "研究哲學"}, {"n": "17", "q": "Researcher selected 5 schools at random, then interviewed each teacher in those schools. This is", "opts": ["a. simple random sampling.", "b. stratified random sampling.", "c. cluster random sampling.", "d. two-stage random sampling."], "ans": "c", "note": "選5所學校→訪問所有老師 = 群集抽樣（cluster sampling）", "cat": "抽樣"}, {"n": "18", "q": "Purpose of stratified random sampling:", "opts": ["a. Every member has equal chance.", "b. Sample proportionately represents different categories.", "c. Most likely to react to treatment.", "d. More representative than accessible population."], "ans": "b", "note": "分層抽樣目的：按比例代表各類別", "cat": "抽樣"}, {"n": "19", "q": "Survey among first year students: first randomly chose courses, then seminar groups, then individual students. This sampling method is:", "opts": ["a. Systematic sampling", "b. Multi-stage sampling", "c. Stratified sampling", "d. Cluster sampling"], "ans": "b", "note": "多階段抽樣（multi-stage sampling）：依序隨機抽取課程→小組→個人", "cat": "抽樣"}, {"n": "20", "q": "A paradigm is:", "opts": ["a. a research tool.", "b. a cluster of beliefs and dictates which influence what should be studied, how, and how to interpret results.", "c. a set of students in a study group.", "d. a research strategy."], "ans": "b", "note": "★高頻：典範（paradigm）= 信念與規範集合體", "cat": "研究哲學"}]}, {"label": "1082（108學年第2學期，2020/4/24）", "qs": [{"n": "1", "q": "To determine which variables relate to which factors:", "opts": ["A) Factor loadings", "B) Communalities", "C) Eigen values", "D) Beta coefficients"], "ans": "A", "note": "★高頻：Factor loadings", "cat": "因素分析"}, {"n": "2", "q": "Which can be used to determine how many factors to take:", "opts": ["A) Eigen values", "B) Scree plots", "C) Percentage of variance", "D) All of the above", "E) None."], "ans": "D", "note": "三者皆可", "cat": "因素分析"}, {"n": "3", "q": "A simple experiment has two groups called", "opts": ["A) Dependent and independent.", "B) Extraneous and independent.", "C) Before and after.", "D) Control and experimental."], "ans": "D", "note": "控制組與實驗組", "cat": "實驗設計"}, {"n": "4", "q": "Two variables causally related if", "opts": ["A) Strong positive correlation.", "B) Extraneous controlled, IV creates consistent differences.", "C) Observed to co-vary on many occasions.", "D) Observed in lab."], "ans": "B", "note": "因果關係條件", "cat": "統計與測量"}, {"n": "5", "q": "__________ designs are research designs with more than one IV.", "opts": ["A) Simple", "B) Monotonic", "C) Factorial", "D) Multi"], "ans": "C", "note": "複因子設計（Factorial design）", "cat": "因素分析"}, {"n": "6", "q": "Error that occurs due to equally affected measurements is called…", "opts": ["A) random error", "B) systematic error", "C) frequent error", "D) precision"], "ans": "B", "note": "系統性誤差（systematic error）：每次測量都朝同一方向偏差", "cat": "抽樣"}, {"n": "7", "q": "Internal consistency reliability is to Cronbach's alpha as interrater reliability is to…", "opts": ["A) Spearman-Brown reliability coefficient.", "B) Pearson product moment correlation.", "C) item-total correlation.", "D) Cohen's Kappa."], "ans": "D", "note": "評分者間信度（interrater）使用Cohen's Kappa係數", "cat": "信度"}, {"n": "8", "q": "Convenience sampling is an example of", "opts": ["A) probabilistic sampling", "B) stratified sampling", "C) nonprobabilistic sampling", "D) cluster sampling"], "ans": "C", "note": "便利抽樣 = 非機率抽樣", "cat": "抽樣"}, {"n": "9", "q": "Stratified random sampling is a method in which", "opts": ["A) sample first divided, then random from each.", "B) various strata from sample.", "C) population first divided, then random from each.", "D) None."], "ans": "C", "note": "母體先分層再各層隨機抽", "cat": "抽樣"}, {"n": "10", "q": "A population characteristic, such as a population mean, is called", "opts": ["A) statistic", "B) a parameter", "C) a sample", "D) the mean deviation"], "ans": "B", "note": "母體特徵 = 參數（parameter）", "cat": "統計與測量"}]}, {"label": "1102（110學年第2學期，2022/4/22）", "qs": [{"n": "1", "q": "Please select the most appropriate statement about paradigm:", "opts": ["a. A paradigm is the name given to the theory which a piece of research is trying to test.", "b. Paradigm is a synonymous word for rules.", "c. A paradigm is a theoretical framework which links to how one sees the world.", "d. The paradigm that sees the world as governed by universal laws is called interpretivist."], "ans": "c", "note": "典範（paradigm）是連結一個人如何看待世界的理論框架；(d)描述的是實証主義非詮釋主義", "cat": "研究哲學"}, {"n": "2", "q": "Empiricism is…", "opts": ["a. ethical rules which underpin research.", "b. inferences about how to approach research.", "c. assumptions about the nature of reality.", "d. the idea that knowledge comes from experience and the five senses."], "ans": "d", "note": "經驗主義（empiricism）：知識主要來自經驗與五感", "cat": "研究哲學"}, {"n": "3", "q": "What is the situation in which Type-I error occurs?", "opts": ["a. The null hypotheses get accepted even if it is false.", "b. The null hypotheses get rejected even if it is true.", "c. Both null and alternative hypotheses are rejected.", "d. None of the above."], "ans": "b", "note": "★高頻：Type I error = 拒絕真實的虛無假設（偽陽性）", "cat": "理論與假設"}, {"n": "4", "q": "The dependent variable is…", "opts": ["a. the variable to which measured changes are attributed to the IV.", "b. a variable not controlled and may influence findings.", "c. the variable being manipulated by researcher.", "d. a variable which may influence findings."], "ans": "a", "note": "依變數（DV）：被測量的變數，其變化歸因於自變數的改變", "cat": "其他"}, {"n": "5", "q": "The main aim of interdisciplinary research is…", "opts": ["a. to over simplify the problem.", "b. to bring out the holistic approach.", "c. to create a new trend in methodology.", "d. to reduce emphasis on a single subject."], "ans": "b", "note": "跨領域研究目的：帶出整體性（holistic）研究取向", "cat": "研究哲學"}, {"n": "6", "q": "Which is a criticism of positivism?", "opts": ["a. By controlling procedures and quantifying, results can help refine theory.", "b. Recognition that children are legitimate subjects for scientific study.", "c. Scientific methods put researchers in a more dominant position than participants.", "d. Positivism gives rise to quantitative methodology and statistical analysis."], "ans": "c", "note": "實証主義批評：科學方法使研究者處於比參與者更主導的權力位置", "cat": "研究哲學"}, {"n": "7", "q": "Methodology…", "opts": ["a. is a description of methods used.", "b. influences the paradigm in which research is located.", "c. describes ideas about how to approach research based on underlying paradigm.", "d. is a term used instead of paradigm."], "ans": "c", "note": "方法論（methodology）：基於底層典範，關於如何進行研究的想法", "cat": "研究哲學"}, {"n": "8", "q": "Please select the best statement about surveys:", "opts": ["a. A survey generally lies within the interpretivist paradigm.", "b. Surveys work best with small groups.", "c. Surveys generally use quantitative methodology.", "d. All students should choose surveys because easy."], "ans": "c", "note": "問卷調查通常使用量化方法論", "cat": "研究哲學"}, {"n": "9", "q": "Please select the most accurate statement about surveys:", "opts": ["a. Any study using a questionnaire is a survey.", "b. For results to be generalizable, participants must be representative.", "c. Surveys obtain in-depth information about attitudes.", "d. One should never use a sampling plan."], "ans": "b", "note": "問卷調查可推論的條件：樣本需代表母體", "cat": "抽樣"}, {"n": "10", "q": "Which one is considered non-probability sampling?", "opts": ["a. Quota sampling", "b. Cluster sampling", "c. Systematic sampling", "d. Stratified random sampling"], "ans": "a", "note": "★高頻：配額抽樣（quota sampling）是非機率抽樣", "cat": "抽樣"}, {"n": "11", "q": "What is the purpose of Factorial Analysis?", "opts": ["a. For setting the hypotheses.", "b. To understand the difference between two variables.", "c. To understand the relationship between two variables.", "d. To understand the difference between various variables.", "e. All of the above."], "ans": "d", "note": "因素分析目的：了解多個變數之間的差異關係（資料縮減、發現潛在構念）", "cat": "因素分析"}, {"n": "12", "q": "In the first stage in designing a survey, researchers should…", "opts": ["a. identify the population.", "b. design the questionnaire.", "c. pilot the questionnaire.", "d. identify the objectives of the survey.", "e. None."], "ans": "d", "note": "問卷設計第一步：確認研究目的（objectives）", "cat": "問卷與調查"}, {"n": "13", "q": "Research problem is selected from the standpoint of", "opts": ["a. researcher's interest.", "b. social relevance.", "c. financial support.", "d. availability of relevant literature.", "e. innovation."], "ans": "a", "note": "研究問題首先來自研究者的興趣", "cat": "其他"}, {"n": "14", "q": "Which should NOT be a criterion for a good research project?", "opts": ["a. Demonstrates researcher's abilities.", "b. Is dependent on the completion of other projects.", "c. Demonstrates integration of different fields.", "d. Develops the skills of the researcher.", "e. All."], "ans": "b", "note": "好的研究不應依賴其他專案完成才能進行", "cat": "效度"}, {"n": "15", "q": "Which form of reasoning draws specific conclusion from premises?", "opts": ["a. Objective reasoning", "b. Inductive reasoning", "c. Positivist reasoning", "d. Deductive reasoning", "e. Subjective reasoning"], "ans": "d", "note": "演繹推理（deductive）：從一般前提推導特殊結論", "cat": "研究哲學"}, {"n": "16", "q": "The F-test…", "opts": ["a. is essentially a two-tailed test.", "b. is essentially a one-tailed test.", "c. can be one-tailed or two-tailed.", "d. can never be one-tailed.", "e. None."], "ans": "b", "note": "F檢定本質上是單尾檢定（只關注方差是否大於預期）", "cat": "其他"}, {"n": "17", "q": "A structured questionnaire is one…", "opts": ["a. where only closed questions are used or respondent chooses from limited options.", "b. where online survey tool is used.", "c. which only includes interviewing questions.", "d. where respondents structure responses as they like.", "e. None."], "ans": "a", "note": "結構式問卷：只使用封閉題或有限選項", "cat": "問卷與調查"}, {"n": "18", "q": "Which is NOT a reason for piloting a questionnaire?", "opts": ["a. To see if questions are understood.", "b. To check that responses answer the research question.", "c. To see if it is not too long.", "d. If first five fill in well, may not need larger study.", "e. To help decide how to analyse data."], "ans": "d", "note": "預試目的：測試問卷；若前5人填好就不做大規模研究 → 這不是合理的理由", "cat": "問卷與調查"}, {"n": "19", "q": "Which is the most comprehensive source of population data?", "opts": ["a. Census", "b. National Sample Surveys", "c. Demographic Health Surveys", "d. National Family Health Surveys", "e. None."], "ans": "a", "note": "人口普查（Census）是最完整的母體資料來源", "cat": "問卷與調查"}, {"n": "20", "q": "The process NOT needed in experimental research is…", "opts": ["a. controlling", "b. observation", "c. reference collection", "d. manipulation and replication", "e. None."], "ans": "c", "note": "文獻收集（reference collection）不是實驗研究的必要程序", "cat": "實驗設計"}]}, {"label": "1112（111學年第2學期，2023/4/21）", "qs": [{"n": "1", "q": "How would you define the research process?", "opts": ["(a) The researcher's plan of action.", "(b) A method of collecting research data.", "(c) The stages or steps the researcher follows in carrying out a research project.", "(d) The account the researcher will write for publication."], "ans": "c", "note": "研究過程：研究者執行研究項目所遵循的階段或步驟", "cat": "研究流程與倫理"}, {"n": "2", "q": "What is the difference between PCA and EFA?", "opts": ["(a) PCA assumes limited underlying factors; EFA does not.", "(b) EFA assumes limited underlying factors; PCA does not.", "(c) PCA is for continuous variables; EFA for categorical.", "(d) EFA is for continuous; PCA for categorical."], "ans": "b", "note": "★重要：EFA假設有少數底層因素（latent factors）；PCA僅做成分縮減，不假設因素結構", "cat": "因素分析"}, {"n": "3", "q": "For a research hypothesis to be testable, which must apply?", "opts": ["(a) Must have a manipulated IV.", "(b) It must be falsifiable.", "(c) Must be supported by past literature.", "(d) Must inform future research hypotheses."], "ans": "b", "note": "可假設性（falsifiability）：假設必須是可被反駁的", "cat": "理論與假設"}, {"n": "4", "q": "What is the purpose of confirmatory factor analysis?", "opts": ["(a) To determine number of factors in EFA.", "(b) To test whether a specified factor structure fits the observed data.", "(c) To identify underlying factors explaining correlations.", "(d) To measure strength of association."], "ans": "b", "note": "★高頻：CFA目的 = 驗證指定的因素結構是否符合資料", "cat": "因素分析"}, {"n": "5", "q": "A correlational design establishes which quality between two variables", "opts": ["(a) Causality.", "(b) Association.", "(c) Mediation.", "(d) Independence."], "ans": "b", "note": "相關設計（correlational design）建立的是關聯性（association），非因果", "cat": "統計與測量"}, {"n": "6", "q": "Which statement is true regarding path diagrams in SEM?", "opts": ["(a) Show only observed variables.", "(b) Show the direction of relationships between variables.", "(c) Used exclusively in EFA.", "(d) Not used in CFA."], "ans": "b", "note": "SEM路徑圖：顯示變數間關係的方向（含潛在構念）", "cat": "其他"}, {"n": "7", "q": "What is a pilot study?", "opts": ["(a) A small scale study for selecting research targets.", "(b) A study involving pilots.", "(c) A study to test the tool of data collection.", "(d) A study that is the first of its type."], "ans": "c", "note": "先導研究（pilot study）：測試資料收集工具的小規模研究", "cat": "問卷與調查"}, {"n": "8", "q": "Disadvantage of pretest-posttest design:", "opts": ["(a) Allows assessment of IV effect over time.", "(b) Time-consuming and costly.", "(c) Eliminates need for control group.", "(d) May create threat to internal validity due to pretest."], "ans": "d", "note": "★高頻：前後測設計缺點 = 前測本身可能影響後測（內部效度威脅）", "cat": "效度"}, {"n": "9", "q": "Moderating variables ___________ whereas mediating variables ___________.", "opts": ["(a) explain; cause.", "(b) influence; explain.", "(c) explain; influence.", "(d) cause; influence."], "ans": "b", "note": "調節變數（moderator）影響（influence）關係強度/方向；中介變數（mediator）解釋（explain）機制", "cat": "其他"}, {"n": "10", "q": "Which is an example of quasi-experimental design?", "opts": ["(a) A randomized controlled trial.", "(b) A pretest-posttest design.", "(c) A nonequivalent control group design.", "(d) A factorial design."], "ans": "c", "note": "★高頻：不等同控制組設計（nonequivalent control group）= 準實驗設計", "cat": "因素分析"}, {"n": "11", "q": "How many types of reasoning in organizational research are there?", "opts": ["(a) One.", "(b) Three: theory-testing, inductive-case, interpretive.", "(c) Two: theory-testing and interpretive.", "(d) Four: positivism, theory-testing, inductive-case, interpretive."], "ans": "b", "note": "組織研究中有三種推理：理論驗證、歸納個案、詮釋性研究", "cat": "研究哲學"}, {"n": "12", "q": "When no interaction occurs with two IVs, the…", "opts": ["(a) effects must be interpreted differently.", "(b) effects can be generalized across levels of the other IV.", "(c) internal validity is increased.", "(d) sensitivity is decreased."], "ans": "b", "note": "無交互作用 → 主效果可跨水準概化", "cat": "效度"}, {"n": "13", "q": "When IV (task difficulty) interacts with IV2 (age), generality of IV1 is…", "opts": ["(a) increased.", "(b) unaffected.", "(c) decreased.", "(d) irrelevant."], "ans": "c", "note": "有交互作用 → 普遍性降低", "cat": "其他"}, {"n": "14", "q": "What is positivism?", "opts": ["(a) An epistemological position advocating natural science methods to social reality.", "(b) A dialogical process between theory and empirical phenomenon.", "(c) A way of thinking about the research process and staying positive.", "(d) An outlook in life about seeing things positively."], "ans": "a", "note": "★超高頻：實証主義 = 用自然科學方法研究社會現實的認識論立場", "cat": "研究哲學"}, {"n": "15", "q": "A paradigm is:", "opts": ["(a) a research tool.", "(b) a cluster of beliefs and dictates which influence what should be studied, how, and how to interpret results.", "(c) a set of students in a study group.", "(d) a research strategy."], "ans": "b", "note": "★超高頻：典範 = 信念與規範集合體", "cat": "研究哲學"}]}, {"label": "1121（112學年第1學期，2023/11/24）", "qs": [{"n": "1", "q": "In using grounded theory, a researcher should:", "opts": ["(a) seek to find relationships among participants.", "(b) seek to find relationships between data and categories.", "(c) try to code all data in one pass.", "(d) ignore data that doesn't fit into categories.", "(e) All."], "ans": "b", "note": "紮根理論：尋找資料與類別之間的關係（持續比較法）", "cat": "質性研究"}, {"n": "2", "q": "In grounded theory, interpretation is:", "opts": ["(a) synonymous with analysis.", "(b) not necessary in qualitative research.", "(c) the process of labeling and breaking down raw data.", "(d) making sense of patterns, themes, concepts found during data analysis."], "ans": "d", "note": "詮釋（interpretation）= 賦予資料分析中發現的模式、主題意義", "cat": "質性研究"}, {"n": "3", "q": "In grounded theory, when data is theoretically saturated:", "opts": ["(a) categories are still emerging.", "(b) data may not fit into specific category.", "(c) conducted from complete observer role.", "(d) no new categories emerging and existing structure appears stable."], "ans": "d", "note": "★高頻：理論飽和 = 不再出現新類別，現有結構穩定", "cat": "質性研究"}, {"n": "4", "q": "What is the purpose of confirmatory factor analysis?", "opts": ["(a) To determine number of factors in EFA.", "(b) To test whether a specified factor structure fits the observed data.", "(c) To identify underlying factors explaining correlations.", "(d) To measure strength of association."], "ans": "b", "note": "★高頻：CFA目的 = 驗證指定因素結構", "cat": "因素分析"}, {"n": "5", "q": "In writing a qualitative research report, it is common for the researcher to…", "opts": ["(a) turn writing to others.", "(b) complete in first attempt.", "(c) continually revise to improve claims and conclusions.", "(d) avoid using frameworks.", "(e) complete without showing to anyone."], "ans": "c", "note": "質化研究報告：持續修改以改善論點與結論", "cat": "質性研究"}, {"n": "6", "q": "Which is true regarding path diagrams in SEM?", "opts": ["(a) Show only observed variables.", "(b) Show the direction of relationships between variables.", "(c) Used exclusively in EFA.", "(d) Not used in CFA."], "ans": "b", "note": "SEM路徑圖：顯示變數間關係方向", "cat": "其他"}, {"n": "7", "q": "A field interview…", "opts": ["(a) is very similar to a survey.", "(b) is simply asking questions and getting answers.", "(c) does not require researcher to be in the interaction setting.", "(d) has the goal of uncovering respondent's point of view using their own terminology.", "(e) occurs spontaneously without planning."], "ans": "d", "note": "田野訪談目的：運用受訪者的語彙揭示其觀點", "cat": "實驗設計"}, {"n": "8", "q": "Disadvantage of pretest-posttest design:", "opts": ["(a) Allows assessment of IV effect over time.", "(b) Time-consuming and costly.", "(c) Eliminates need for control group.", "(d) May create threat to internal validity due to pretest."], "ans": "d", "note": "★高頻：前後測的內部效度威脅", "cat": "效度"}, {"n": "9", "q": "The focus group moderator:", "opts": ["(a) may or may not be the researcher.", "(b) should be as demographically different as possible.", "(c) needs skills in moderating debates.", "(d) should talk to keep silence from developing.", "(e) should not encourage participants to talk among themselves."], "ans": "a", "note": "焦點團體主持人可以是也可以不是研究者本人", "cat": "質性研究"}, {"n": "10", "q": "Which is an example of quasi-experimental design?", "opts": ["(a) A randomized controlled trial.", "(b) A pretest-posttest design.", "(c) A nonequivalent control group design.", "(d) A factorial design."], "ans": "c", "note": "★高頻：不等同控制組設計 = 準實驗設計", "cat": "因素分析"}, {"n": "11", "q": "A skewed curve is:", "opts": ["(a) symmetrical.", "(b) characterized by identical left and right slopes.", "(c) characterized by mean, median, and mode in same location.", "(d) characterized by data being bunched to one side or the other.", "(e) a theoretical distribution of scores."], "ans": "d", "note": "偏態分配（skewed curve）：資料集中在一側", "cat": "統計與測量"}, {"n": "12", "q": "Type 1 error occurs when:", "opts": ["(a) null hypothesis rejected even though it is true.", "(b) null hypothesis retained when it is true.", "(c) researcher does not claim difference and one is not identified.", "(d) researcher claims difference when one does not exist.", "(e) a and d."], "ans": "e", "note": "Type I error：(a)拒絕真的H0 = (d)聲稱有差異但實際上沒有，兩種描述等同", "cat": "理論與假設"}, {"n": "13", "q": "A social desirability response is:", "opts": ["(a) the correct answer to the question.", "(b) the answer participants want to give but feel uncomfortable sharing.", "(c) the answer the participant believes the researcher is seeking.", "(d) the answer the interviewer indicates he or she desires.", "(e) a response indicating participant declines to answer."], "ans": "c", "note": "社會期許反應（social desirability）：參與者給出他們認為研究者想要的答案", "cat": "問卷與調查"}, {"n": "14", "q": "Internal reliability is the degree to which:", "opts": ["(a) participants return their questionnaires.", "(b) participants answer all questions.", "(c) all participants gave similar response to an item.", "(d) multiple items are consistent in measuring a construct."], "ans": "d", "note": "★高頻：內部信度 = 多個題目在測量同一構念時的一致程度", "cat": "信度"}, {"n": "15", "q": "A manipulation check is used to determine if the:", "opts": ["(a) dependent variable was manipulated as intended.", "(b) independent variable was manipulated as intended.", "(c) sample is representative of population.", "(d) correct research procedures were used.", "(e) posttest was same as pretest."], "ans": "b", "note": "★高頻：操弄確認（manipulation check）= 確認自變數是否如預期被操弄", "cat": "實驗設計"}]}, {"label": "1131（113學年第1學期，2024/11/22）", "qs": [{"n": "1", "q": "Which correlation coefficient indicates the strongest relationship?", "opts": ["a. +0.05", "b. -0.45", "c. +0.75", "d. -0.85"], "ans": "d", "note": "相關係數的強度取決於絕對值，-0.85的絕對值最大（最強）", "cat": "統計與測量"}, {"n": "2", "q": "Disadvantage of field experiments in social psychology:", "opts": ["a. Lacks control over extraneous variables.", "b. Time-consuming and expensive.", "c. Cannot establish cause-and-effect.", "d. May lead to demand characteristics."], "ans": "a", "note": "田野實驗缺點：缺乏對外在變數的控制", "cat": "實驗設計"}, {"n": "3", "q": "Cannot manipulate or control two variables. Which design most appropriate?", "opts": ["a. True-experimental.", "b. Observational.", "c. Correlational.", "d. Quasi-experimental."], "ans": "c", "note": "無法操弄或控制變數 → 相關設計（correlational design）", "cat": "實驗設計"}, {"n": "4", "q": "Random assignment is critical because it helps to:", "opts": ["a. Ensure representative sample.", "b. Control confounding variables and establish cause-and-effect.", "c. Increase external validity.", "d. Minimize demand characteristics."], "ans": "b", "note": "★高頻：隨機分派 = 控制混淆變數，建立因果推論", "cat": "效度"}, {"n": "5", "q": "To generalize study results to larger population, researcher should aim for:", "opts": ["a. High internal validity.", "b. High statistical power.", "c. High statistical significance.", "d. High external validity."], "ans": "d", "note": "概化到母體 = 高外部效度（external validity）", "cat": "效度"}, {"n": "6", "q": "Convenience sampling is an example of", "opts": ["a. probabilistic sampling", "b. stratified sampling", "c. nonprobabilistic sampling", "d. cluster sampling"], "ans": "c", "note": "便利抽樣 = 非機率抽樣", "cat": "抽樣"}, {"n": "7", "q": "Which is an example of nonprobabilistic sampling?", "opts": ["a. simple random sampling", "b. stratified simple random sampling", "c. cluster sampling", "d. judgment sampling"], "ans": "d", "note": "判斷抽樣（judgment sampling）= 非機率抽樣", "cat": "抽樣"}, {"n": "8", "q": "Stratified random sampling is a method in which", "opts": ["a. sample first divided, then random from each.", "b. various strata from sample.", "c. population first divided, then random from each.", "d. None."], "ans": "c", "note": "★高頻：母體先分層再各層隨機抽", "cat": "抽樣"}, {"n": "9", "q": "Simple random sample from infinite population, such that", "opts": ["a. each element independently from same population.", "b. each has 0.5 probability.", "c. each has at least 0.5 probability.", "d. probability changes."], "ans": "a", "note": "簡單隨機抽樣：獨立且從同一母體", "cat": "抽樣"}, {"n": "10", "q": "A population characteristic, such as mean, is called", "opts": ["a. a statistic", "b. a parameter", "c. a sample", "d. the mean deviation"], "ans": "b", "note": "母體特徵 = 參數（parameter）", "cat": "統計與測量"}, {"n": "11", "q": "A sample statistic, such as sample mean, is known as", "opts": ["a. a statistic", "b. a parameter", "c. the mean deviation", "d. the central limit theorem"], "ans": "a", "note": "樣本特徵 = 統計量（statistic）", "cat": "統計與測量"}, {"n": "12", "q": "Sample of 28 observations, mean = 50. Fifty is a", "opts": ["a. population parameter", "b. biased estimate of population mean", "c. sample parameter", "d. point estimate"], "ans": "d", "note": "點估計（point estimate）", "cat": "質性研究"}, {"n": "13", "q": "Cluster sampling is", "opts": ["a. nonprobability method", "b. same as convenience sampling", "c. probability method", "d. None."], "ans": "c", "note": "群集抽樣 = 機率抽樣", "cat": "抽樣"}, {"n": "14", "q": "Which represents an unrestricted method for selecting sample elements?", "opts": ["a. Systematic random sample", "b. Cluster random sample", "c. Simple random sample", "d. Quota sample"], "ans": "c", "note": "簡單隨機 = 最不受限制的抽樣方法", "cat": "抽樣"}, {"n": "15", "q": "The sampling frame", "opts": ["a. should be a listing of the population itself.", "b. always prepared on random selection basis.", "c. details the sample selection procedure.", "d. is the list of items selected in the sample."], "ans": "a", "note": "抽樣架構（sampling frame）= 母體清單", "cat": "抽樣"}, {"n": "16", "q": "Random sampling error", "opts": ["a. difference between those who responded and those who failed to respond.", "b. does not occur in nonprobability samples.", "c. results from inappropriate administration of the sampling process.", "d. applies only to simple random sampling.", "e. is a function of sample size."], "ans": "e", "note": "隨機抽樣誤差是樣本量的函數（n↑→誤差↓）", "cat": "抽樣"}, {"n": "17", "q": "Researcher categorizes users into three groups, draws random from each. _____ sample.", "opts": ["a. random", "b. stratified", "c. judgment", "d. group data", "e. quota"], "ans": "b", "note": "★超高頻：分層隨機抽樣", "cat": "抽樣"}, {"n": "18", "q": "Random starting point, then every 50th invoice. _____ sample.", "opts": ["a. simple random", "b. sequential", "c. stratified", "d. systematic", "e. none."], "ans": "d", "note": "系統抽樣（systematic sampling）：隨機起點後每隔固定間隔抽取", "cat": "抽樣"}, {"n": "19", "q": "Nominal scale, users vs nonusers. Appropriate central tendency:", "opts": ["a. mean.", "b. median.", "c. mode.", "d. average.", "e. range."], "ans": "c", "note": "名義尺度 → 眾數（mode）", "cat": "統計與測量"}, {"n": "20", "q": "Parameters are", "opts": ["a. numerical characteristics of a sample.", "b. numerical characteristics of a population.", "c. averages taken from a sample.", "d. characteristics of either sample or population."], "ans": "b", "note": "參數（parameters）= 母體數值特徵", "cat": "統計與測量"}, {"n": "21", "q": "Purpose of replicating a research study?", "opts": ["a. Confirm hypothesis is incorrect.", "b. Prove the study was flawed.", "c. Support the contention that hypothesis cannot be rejected.", "d. Provide opportunity to alter hypothesis."], "ans": "c", "note": "複製研究目的：支持假設無法被拒絕（強化信心）", "cat": "理論與假設"}, {"n": "22", "q": "Bibliography in a research report…", "opts": ["a. shows vast knowledge.", "b. helps those interested in further research.", "c. has no relevance.", "d. all the above."], "ans": "b", "note": "文獻目錄幫助有興趣進一步研究的讀者", "cat": "其他"}, {"n": "23", "q": "Authenticity of a research finding is its:", "opts": ["a. Originality", "b. Validity", "c. Objectivity", "d. All of the above."], "ans": "d", "note": "研究發現的真實性涵蓋原創性、效度與客觀性", "cat": "效度"}, {"n": "24", "q": "Which technique generally followed when population is finite?", "opts": ["a. Area Sampling", "b. Purposive Sampling", "c. Systematic Sampling", "d. None."], "ans": "c", "note": "有限母體常用系統抽樣（systematic sampling）", "cat": "抽樣"}, {"n": "25", "q": "Research problem selected from standpoint of:", "opts": ["a. Researcher's interest", "b. Financial support", "c. Social relevance", "d. Availability of relevant literature"], "ans": "a", "note": "研究問題首選：研究者的興趣", "cat": "其他"}, {"n": "26", "q": "Coffee study: SD = 3, estimate within ±0.4 at two-sigma. Number of clusters needed?", "opts": ["a. 10", "b. 20", "c. 60", "d. 230"], "ans": "d", "note": "n = (2×3/0.4)² =
